name: Test - Upload Release Collaterals

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Current version (no 0x prefix, e.g. 836003C4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-release-collaterals:
    runs-on: [self-hosted, node16]

    steps:
      - name: Checkout repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          WORKDIR="${GITHUB_WORKSPACE}"
          PARENT_DIR="$(dirname "$WORKDIR")"
          REPO_DIR="$(basename "$WORKDIR")"
          BRANCH="${{ github.ref_name }}"

          mkdir -p "$PARENT_DIR"
          cd "$PARENT_DIR"

          if [ -d "$WORKDIR/.git" ]; then
            cd "$WORKDIR"
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
          else
            rm -rf "$WORKDIR"
            git clone --depth=1 --branch "$BRANCH" "$REPO_URL" "$REPO_DIR"
            cd "$WORKDIR"
          fi

          git config --global --add safe.directory "$WORKDIR"

      - name: Preflight checks
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "::notice::Preflight started"
          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            echo "::error::REPO_PUSH_TOKEN is missing"
            exit 1
          fi

          CURRENT_VERSION="${{ github.event.inputs.version }}"
          SRC_RELEASE_DIR="/nfs/site/disks/dcsg_0729/patches/SRF/C0/build/${CURRENT_VERSION}/release"

          echo "::notice::Current version: ${CURRENT_VERSION}"
          echo "::notice::Release dir: ${SRC_RELEASE_DIR}"
          if [ ! -d "$SRC_RELEASE_DIR" ]; then
            echo "::error::Release directory not found: ${SRC_RELEASE_DIR}"
            exit 1
          fi

          echo "::notice::Preflight passed"

      - name: Zip and upload SRF INC/PDB files via git push
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -Eeuo pipefail

          # GITHUB_STEP_SUMMARY may be unset/empty on older self-hosted runner
          # agent versions. Fall back to /dev/null so summary writes never crash
          # the whole step - the ::error:: annotations are the real diagnostic
          # channel and don't depend on this at all.
          SUMMARY="${GITHUB_STEP_SUMMARY:-}"
          if [ -z "$SUMMARY" ]; then
            echo "::warning::GITHUB_STEP_SUMMARY is empty/unset on this runner - summary output will be skipped. Check runner agent version."
            SUMMARY="/dev/null"
          fi

          log() {
            echo "$1"
            echo "$1" >> "$SUMMARY"
          }

          # Emits a GitHub Actions error annotation (visible in the "Annotations" panel
          # at the top of the run page, no log-read permission required) AND writes to
          # the summary/stdout, then exits 1.
          fail() {
            local msg="$1"
            echo "::error::${msg}"
            log "- ${msg}"
            exit 1
          }

          on_err() {
            local rc=$?
            echo "::error::Step exited with code ${rc} (unhandled failure - see Summary for details)"
            log ""
            log "### Failure"
            log "- Exit code: ${rc}"
            if [ -f existing_file.json ]; then
              log "- existing_file.json:"
              printf '%s\n' '```json' >> "$SUMMARY"
              cat existing_file.json >> "$SUMMARY"
              printf '%s\n' '```' >> "$SUMMARY"
            fi
            if [ -f api_response.json ]; then
              log "- api_response.json:"
              printf '%s\n' '```json' >> "$SUMMARY"
              cat api_response.json >> "$SUMMARY"
              printf '%s\n' '```' >> "$SUMMARY"
            fi
            exit "${rc}"
          }
          trap on_err ERR

          log "## SRF Zipped Collateral Upload (standalone test)"

          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            fail "REPO_PUSH_TOKEN secret is empty or unavailable"
          fi

          CURRENT_VERSION="${{ github.event.inputs.version }}"
          CURRENT_VERSION_LOWER="$(echo "$CURRENT_VERSION" | tr '[:upper:]' '[:lower:]')"
          SRC_RELEASE_DIR="/nfs/site/disks/dcsg_0729/patches/SRF/C0/build/${CURRENT_VERSION}/release"

          log "- Version: \`$CURRENT_VERSION\`"
          log "- Release directory: \`$SRC_RELEASE_DIR\`"

          [ -d "$SRC_RELEASE_DIR" ] || fail "Release directory not found: $SRC_RELEASE_DIR"

          log "- Directory listing:"
          printf '%s\n' '```' >> "$SUMMARY"
          ls -la "$SRC_RELEASE_DIR" >> "$SUMMARY" 2>&1 || true
          printf '%s\n' '```' >> "$SUMMARY"

          INC_FILE=$(find "$SRC_RELEASE_DIR" -maxdepth 1 -name "m_*_*_${CURRENT_VERSION_LOWER}.inc" -type f | head -n 1)
          PDB_FILE=$(find "$SRC_RELEASE_DIR" -maxdepth 1 -name "m_*_*_${CURRENT_VERSION_LOWER}.pdb" -type f | head -n 1)

          [ -n "$INC_FILE" ] || fail "No INC file matching m_*_*_${CURRENT_VERSION_LOWER}.inc found in $SRC_RELEASE_DIR"
          [ -n "$PDB_FILE" ] || fail "No PDB file matching m_*_*_${CURRENT_VERSION_LOWER}.pdb found in $SRC_RELEASE_DIR"

          log "- Found INC file: \`$INC_FILE\`"
          log "- Found PDB file: \`$PDB_FILE\`"

          INC_BASENAME=$(basename "$INC_FILE")
          PDB_BASENAME=$(basename "$PDB_FILE")

          INC_ZIP="/tmp/${INC_BASENAME}.zip"
          PDB_ZIP="/tmp/${PDB_BASENAME}.zip"

          TARGET_DIR="$GITHUB_WORKSPACE/output_paths/SRF_release_collaterals/${CURRENT_VERSION}"
          TARGET_INC_ZIP="$TARGET_DIR/${INC_BASENAME}.zip"
          TARGET_PDB_ZIP="$TARGET_DIR/${PDB_BASENAME}.zip"

          if [ -f "$TARGET_INC_ZIP" ] && [ -f "$TARGET_PDB_ZIP" ]; then
            log "- Release collateral zip files already exist, skipping upload job"
            exit 0
          fi

          rm -f "$INC_ZIP" "$PDB_ZIP"

          zip -j "$INC_ZIP" "$INC_FILE"
          zip -j "$PDB_ZIP" "$PDB_FILE"

          log "- Created zip: \`$INC_ZIP\`"
          log "- Created zip: \`$PDB_ZIP\`"
          log "- INC zip size: \`$(ls -lh "$INC_ZIP" | awk '{print $5}')\`"
          log "- PDB zip size: \`$(ls -lh "$PDB_ZIP" | awk '{print $5}')\`"

          mkdir -p "$TARGET_DIR"
          cp "$INC_ZIP" "$TARGET_INC_ZIP"
          cp "$PDB_ZIP" "$TARGET_PDB_ZIP"

          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add "$TARGET_INC_ZIP" "$TARGET_PDB_ZIP"

          if git diff --cached --quiet; then
            log "- No release collateral changes to commit"
          else
            git commit -m "Upload SRF zipped collaterals for ${CURRENT_VERSION}"
            git push origin "${{ github.ref_name }}"
          fi

          rm -f "$INC_ZIP" "$PDB_ZIP"
