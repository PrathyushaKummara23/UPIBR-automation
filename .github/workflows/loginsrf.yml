name: SRF SSH Login - Test

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
    secrets:
      SRF_HOST:
        required: true
      SRF_USERNAME:
        required: true
      SRF_PASSWORD:
        required: true

jobs:
  srf-login:
    name: SRF SSH Login
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Session Info Display
        if: ${{ inputs.session_id != '' }}
        shell: bash
        run: |
          echo "Session ID: ${{ inputs.session_id }}"
          echo "Triggered by: ${{ inputs.trigger_source }}"
          echo "Callback URL: ${{ inputs.callback_url }}"

      - name: SSH into SRF host and run deploy_reboot_wrapper.py
        env:
          SRF_HOST: ${{ secrets.SRF_HOST }}
          SRF_USER: ${{ secrets.SRF_USERNAME }}
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "================================================="
          echo "  SRF SSH Login - Post Build Auto Login"
          echo "================================================="

          cat > /tmp/ssh_login_${{ github.run_id }}.exp << 'EOF'
          #!/usr/bin/expect -f
          # Default timeout for all expect calls (30s for fast failure)
          set timeout 30
          set srf_host $env(SRF_HOST)
          set srf_user $env(SRF_USER)
          set password $env(SRF_PASSWORD)
          set prompt_re {(?m)[A-Za-z0-9_.@-]+ [A-Za-z]:\\[^\r\n]*>[ ]?$}

          if {$srf_host eq ""} {
            puts "FAILURE: SRF_HOST is empty"
            exit 10
          }
          if {$srf_user eq ""} {
            puts "FAILURE: SRF_USER is empty"
            exit 11
          }
          if {$password eq ""} {
            puts "FAILURE: SRF_PASSWORD is empty"
            exit 16
          }

          spawn ssh -T -o ConnectTimeout=30 -o StrictHostKeyChecking=no $srf_user@$srf_host

          # Login: wait for password prompt then shell prompt
          expect {
            -re {(?i)are you sure you want to continue connecting} {
              send "yes\r"
              exp_continue
            }
            -re {(?i)password:} {
              send "$password\r"
              exp_continue
            }
            -re {(?i)permission denied} {
              puts "FAILURE: Permission denied"
              exit 13
            }
            -re $prompt_re { }
            timeout {
              puts "FAILURE: Connection timed out"
              exit 124
            }
            eof {
              catch wait result
              set rc [lindex $result 3]
              puts "FAILURE: SSH closed during login (rc=$rc)"
              exit $rc
            }
          }

          # Verify remote user: send echo %USERNAME% and wait for the next prompt.
          # The username will appear in the output buffer before the prompt arrives.
          send "echo %USERNAME%\r"
          expect {
            -re $prompt_re {
              # Extract the username from the captured buffer (line before the prompt)
              set buf $expect_out(buffer)
              if {[regexp {(?:\r?\n)([A-Za-z0-9._-]+)\r?\n} $buf _ remote_user]} {
                puts "Remote user verified: [string trim $remote_user]"
              } else {
                puts "Remote user: (prompt received, username extraction skipped)"
              }
            }
            timeout {
              puts "FAILURE: Unable to verify remote SSH user"
              exit 14
            }
            eof {
              catch wait result
              set rc [lindex $result 3]
              puts "FAILURE: SSH closed while running echo %USERNAME% (rc=$rc)"
              exit $rc
            }
          }

          # Run the deploy script — give it up to 5 minutes to complete
          set timeout 300
          send "cmd /c \"set MICROCODE_INPUT_DIR=C:\\Users\\pkummara\\IFWI_INC_PDB\\test && cd /d C:\\Users\\pkummara\\scripts && C:\\Python310\\python.exe -u deploy_reboot_wrapper.py\"\r"
          expect {
            -re $prompt_re { }
            timeout { puts "FAILURE: Python script did not complete"; exit 124 }
            eof {
              catch wait result
              set rc [lindex $result 3]
              puts "FAILURE: SSH closed while running deploy script (rc=$rc)"
              exit $rc
            }
          }

          set timeout 30
          send "exit\r"
          expect eof
          catch wait result
          set rc [lindex $result 3]
          exit $rc
          EOF

          chmod +x /tmp/ssh_login_${{ github.run_id }}.exp
          echo "Connecting to SRF host via SSH..."
          /usr/bin/expect /tmp/ssh_login_${{ github.run_id }}.exp
          SSH_EXIT=$?
          rm -f /tmp/ssh_login_${{ github.run_id }}.exp

          if [ $SSH_EXIT -eq 0 ]; then
            echo "SUCCESS: SSH login and command executed successfully"
          else
            echo "FAILURE: SSH connection failed with exit code: $SSH_EXIT"
            exit $SSH_EXIT
          fi

      - name: Send SRF Login Notification
        if: ${{ inputs.callback_url != '' }}
        env:
          SRF_HOST: ${{ secrets.SRF_HOST }}
          SRF_USER: ${{ secrets.SRF_USERNAME }}
        shell: bash
        run: |
          echo "Sending SRF login notification..."

          CALLBACK_URL="${{ inputs.callback_url }}"
          SESSION_ID="${{ inputs.session_id }}"

          if [ -n "$CALLBACK_URL" ]; then
            PAYLOAD=$(printf '{"session_id":"%s","status":"srf_login_completed","message":"SRF login process completed","workflow_run_id":"%s","timestamp":"%s","trigger_source":"%s","srf_login_details":{"host":"%s","user":"%s","completed_at":"%s"}}' \
              "$SESSION_ID" \
              "${{ github.run_id }}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${{ inputs.trigger_source }}" \
              "$SRF_HOST" \
              "$SRF_USER" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            curl --noproxy 127.0.0.1 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "Failed to send SRF login notification"
          else
            echo "No callback URL provided, skipping notification"
          fi
