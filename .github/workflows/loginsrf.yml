name: SRF SSH Login - Test

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
      srf_host:
        description: 'SRF host IP or hostname'
        required: false
        type: string
        default: '10.138.186.198'
      srf_user:
        description: 'SRF SSH user'
        required: false
        type: string
        default: 'CEFLS_User'
      target_ip:
        description: 'Target host IP'
        required: false
        type: string
        default: '10.138.186.208'
      target_user:
        description: 'Target SSH user'
        required: false
        type: string
        default: 'root'
      bmc_ip:
        description: 'BMC IP'
        required: false
        type: string
        default: '10.138.186.218'
      bmc_user:
        description: 'BMC user'
        required: false
        type: string
        default: 'root'
      apc_ip:
        description: 'APC IP'
        required: false
        type: string
        default: '10.138.186.171'
      apc_user:
        description: 'APC user'
        required: false
        type: string
        default: 'apc'
      apc_outlet:
        description: 'APC outlet number'
        required: false
        type: string
        default: '3'
      putty_path:
        description: 'Putty exe path'
        required: false
        type: string
        default: 'C:\Program Files\PuTTY\putty.exe'
      putty_com_port:
        description: 'Putty COM port'
        required: false
        type: string
        default: 'COM3'
      putty_baud_rate:
        description: 'Putty baud rate'
        required: false
        type: string
        default: '115200'
  workflow_call:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
      srf_host:
        description: 'SRF host IP or hostname'
        required: false
        type: string
        default: '10.138.186.198'
      srf_user:
        description: 'SRF SSH user'
        required: false
        type: string
        default: 'CEFLS_User'
      target_ip:
        description: 'Target host IP'
        required: false
        type: string
        default: '10.138.186.208'
      target_user:
        description: 'Target SSH user'
        required: false
        type: string
        default: 'root'
      bmc_ip:
        description: 'BMC IP'
        required: false
        type: string
        default: '10.138.186.218'
      bmc_user:
        description: 'BMC user'
        required: false
        type: string
        default: 'root'
      apc_ip:
        description: 'APC IP'
        required: false
        type: string
        default: '10.138.186.171'
      apc_user:
        description: 'APC user'
        required: false
        type: string
        default: 'apc'
      apc_outlet:
        description: 'APC outlet number'
        required: false
        type: string
        default: '3'
      putty_path:
        description: 'Putty exe path'
        required: false
        type: string
        default: 'C:\Program Files\PuTTY\putty.exe'
      putty_com_port:
        description: 'Putty COM port'
        required: false
        type: string
        default: 'COM3'
      putty_baud_rate:
        description: 'Putty baud rate'
        required: false
        type: string
        default: '115200'
    secrets:
      SRF_PASSWORD:
        required: true
      TARGET_PASSWORD:
        required: true
      BMC_PASSWORD:
        required: true
      APC_PASSWORD:
        required: true

jobs:
  srf-login:
    name: SRF SSH Login
    runs-on: [self-hosted, node16]

    steps:
      - name: Session Info Display
        if: ${{ inputs.session_id != '' }}
        shell: bash
        run: |
          echo "Session ID: ${{ inputs.session_id }}"
          echo "Triggered by: ${{ inputs.trigger_source }}"
          echo "Callback URL: ${{ inputs.callback_url }}"

      - name: SSH into SRF host and run deploy_reboot_wrapper.py
        env:
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
          TARGET_PASSWORD: ${{ secrets.TARGET_PASSWORD }}
          BMC_PASSWORD: ${{ secrets.BMC_PASSWORD }}
          APC_PASSWORD: ${{ secrets.APC_PASSWORD }}
          SRF_HOST: ${{ inputs.srf_host }}
          SRF_USER: ${{ inputs.srf_user }}
          TARGET_IP: ${{ inputs.target_ip }}
          TARGET_USER: ${{ inputs.target_user }}
          BMC_IP: ${{ inputs.bmc_ip }}
          BMC_USER: ${{ inputs.bmc_user }}
          APC_IP: ${{ inputs.apc_ip }}
          APC_USER: ${{ inputs.apc_user }}
          APC_OUTLET: ${{ inputs.apc_outlet }}
          PUTTY_PATH: ${{ inputs.putty_path }}
          PUTTY_COM_PORT: ${{ inputs.putty_com_port }}
          PUTTY_BAUD_RATE: ${{ inputs.putty_baud_rate }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "  SRF SSH Login - Post Build Auto Login"
          echo "================================================="

          for var_name in SRF_PASSWORD TARGET_PASSWORD BMC_PASSWORD APC_PASSWORD; do
            if [ -z "${!var_name:-}" ]; then
              echo "FAILURE: $var_name is not set in environment"
              exit 1
            fi
          done

          cat > /tmp/ssh_login_${{ github.run_id }}.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 3000
          # Default match_max (2000 bytes) silently drops the oldest output once exceeded,
          # truncating the deploy_reboot_wrapper.py log captured for failure reporting below.
          match_max 1000000
          set password $env(SRF_PASSWORD)
          set target_password $env(TARGET_PASSWORD)
          set target_user $env(TARGET_USER)
          set bmc_password $env(BMC_PASSWORD)
          set apc_password $env(APC_PASSWORD)
          set tgt_ip $env(TARGET_IP)
          set bmc_ip $env(BMC_IP)
          set bmc_user $env(BMC_USER)
          set apc_ip $env(APC_IP)
          set apc_user $env(APC_USER)
          set apc_outlet $env(APC_OUTLET)
          set putty_path $env(PUTTY_PATH)
          set putty_com_port $env(PUTTY_COM_PORT)
          set putty_baud_rate $env(PUTTY_BAUD_RATE)
          set srf_user $env(SRF_USER)

          set config_path "C:\\pkummara\\apis\\automation_config.ini"
          set script_path "C:\\pkummara\\scripts\\deploy_reboot_wrapper.py"

          # ServerAlive keepalives keep this session alive through the long silent
          # waits (e.g. 1200s post-reboot SSH wait) so a network firewall/NAT idle
          # timeout doesn't kill this outer SSH session (and the wrapper under it).
          spawn ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardX11=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 $env(SRF_USER)@$env(SRF_HOST)

          expect {
            "*assword:*" { send "$password\r" }
            "Permission denied" { puts "FAILURE: Invalid SSH credentials"; exit 1 }
            "Connection refused" { puts "FAILURE: SSH connection refused"; exit 1 }
            "Could not resolve hostname" { puts "FAILURE: Hostname resolution failed"; exit 1 }
            "No route to host" { puts "FAILURE: No route to host"; exit 1 }
            timeout { puts "FAILURE: Connection timed out"; exit 1 }
            eof { puts "FAILURE: SSH session terminated before password prompt"; exit 1 }
          }

          expect {
            "Permission denied" { puts "FAILURE: Invalid SSH credentials"; exit 1 }
            "*assword:*" { puts "FAILURE: Password rejected"; exit 1 }
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: Shell prompt not received"; exit 1 }
            eof { puts "FAILURE: SSH session closed after login"; exit 1 }
          }

          send "whoami\r"
          expect {
            -re {.*(>|#|\$|PS ).*} {
              set whoami_output $expect_out(buffer)
              if {![string match -nocase "*$srf_user*" $whoami_output]} {
                puts "FAILURE: whoami did not return expected user"
                puts "WHOAMI OUTPUT: $whoami_output"
                exit 1
              }
            }
            timeout { puts "FAILURE: whoami did not complete"; exit 1 }
            eof { puts "FAILURE: SSH session closed after whoami"; exit 1 }
          }

          send "if exist \"$script_path\" (echo SCRIPT_FOUND) else (echo SCRIPT_MISSING)\r"
          expect {
            "SCRIPT_FOUND" {}
            "SCRIPT_MISSING" { puts "FAILURE: deploy_reboot_wrapper.py not found at expected path"; exit 1 }
            timeout { puts "FAILURE: Script existence check timed out"; exit 1 }
            eof { puts "FAILURE: SSH session closed during script existence check"; exit 1 }
          }

          expect {
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: Prompt not received after script existence check"; exit 1 }
            eof { puts "FAILURE: SSH session closed after script existence check"; exit 1 }
          }

          # create/update automation_config.ini on the remote host so imported
          # `apis.automation_config` will see TARGET/BMC/APC credentials at import time.
          # Delete existing file, write in one grouped block, then verify. Suppress logging while writing secrets.
          log_user 0
          send "if exist \"$config_path\" del \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}

          send "(\r"
          send "  echo.\[NETWORK\]\r"
          send "  echo.TARGET_IP=$tgt_ip\r"
          send "  echo.TARGET_USER=$target_user\r"
          send "  echo.TARGET_PASSWORD=$target_password\r"
          send "  echo.\r"
          send "  echo.\[BMC\]\r"
          send "  echo.BMC_IP=$bmc_ip\r"
          send "  echo.BMC_USER=$bmc_user\r"
          send "  echo.BMC_PASSWORD=$bmc_password\r"
          send "  echo.\r"
          send "  echo.\[APC\]\r"
          send "  echo.APC_IP=$apc_ip\r"
          send "  echo.APC_USER=$apc_user\r"
          send "  echo.APC_PASSWORD=$apc_password\r"
          send "  echo.APC_OUTLET=$apc_outlet\r"
          send "  echo.\r"
          send "  echo.\[PUTTY\]\r"
          send "  echo.PUTTY_PATH=$putty_path\r"
          send "  echo.PUTTY_COM_PORT=$putty_com_port\r"
          send "  echo.PUTTY_BAUD_RATE=$putty_baud_rate\r"
          send "  echo.PUTTY_LOG_ENABLED=False\r"
          send ") > \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}

          send "if exist \"$config_path\" (echo CONFIG_OK) else (echo CONFIG_FAILED)\r"
          expect {
            "CONFIG_OK" {}
            "CONFIG_FAILED" { puts "FAILURE: Config file creation failed"; exit 1 }
            timeout { puts "FAILURE: Config verification timed out"; exit 1 }
            eof { puts "FAILURE: SSH session closed during config verification"; exit 1 }
          }
          expect -re {.*(>|#|\$|PS ).*}

          # Debug: dump config contents (stays hidden from the Actions log since log_user is 0)
          send "type \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          log_user 1

          send "cd C:\\pkummara\\scripts\r"
          expect {
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: cd to scripts directory did not complete"; exit 1 }
            eof { puts "FAILURE: SSH session closed while changing directory"; exit 1 }
          }

          # Export credentials as env vars too, in case the remote scripts fall back
          # to os.environ when the ini file hasn't been read yet. Hidden from the log.
          log_user 0
          send "set BMC_IP=$bmc_ip\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "set BMC_USER=$bmc_user\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "set BMC_PASSWORD=$bmc_password\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "set TARGET_IP=$tgt_ip\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "set TARGET_USER=$target_user\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "set TARGET_PASSWORD=$target_password\r"
          expect -re {.*(>|#|\$|PS ).*}
          log_user 1

          # BMC SSH auth is occasionally slow to come up; retry the whole script run
          # a few times if the failure looks like a transient BMC AuthenticationException.
          set max_py_retries 3
          set py_attempt 0
          set py_success 0

          while {$py_attempt < $max_py_retries && !$py_success} {
            incr py_attempt
            puts "Running deploy_reboot_wrapper.py (attempt $py_attempt of $max_py_retries)..."

            # Use a unique completion marker instead of a generic prompt regex:
            # the script's own log lines can contain '>' (e.g. "2>/dev/null"),
            # which previously made expect think the command had finished early.
            set py_marker "PYEXIT_MARKER_${py_attempt}_[clock clicks]"
            send "py -3 -u .\\deploy_reboot_wrapper.py & echo ${py_marker}=%ERRORLEVEL%\r"
            set py_output ""
            set py_exit ""
            expect {
              -re "$py_marker=(\[0-9\]+)" {
                set py_exit $expect_out(1,string)
                set py_output $expect_out(buffer)
              }
              timeout {
                puts "FAILURE: Python script did not complete"
                exit 1
              }
              eof {
                puts "FAILURE: SSH session closed while waiting for Python script completion"
                exit 1
              }
            }

            if {[string match -nocase "*can't open file*" $py_output]} {
              puts "FAILURE: Python could not open deploy_reboot_wrapper.py"
              puts $py_output
              exit 1
            }

            set bmc_auth_failed [expr {[string match -nocase "*AuthenticationException*" $py_output] || [string match -nocase "*bmc*authentication*failed*" $py_output]}]
            set py_has_traceback [string match -nocase "*Traceback (most recent call last)*" $py_output]

            # deploy_reboot_wrapper.py has been observed to catch internal errors
            # (e.g. TimeoutError waiting for SSH after reboot) and still exit 0,
            # so a traceback in the output must fail the step even when py_exit is 0.
            if {$py_exit ne "0" || $py_has_traceback} {
              if {($bmc_auth_failed || $py_has_traceback) && $py_attempt < $max_py_retries} {
                puts "WARNING: deploy_reboot_wrapper.py failed on attempt $py_attempt (exit $py_exit, bmc_auth_failed=$bmc_auth_failed), retrying in 5s..."
                sleep 5
                continue
              }
              puts "FAILURE: deploy_reboot_wrapper.py reported a failure (exit $py_exit, traceback_detected=$py_has_traceback)"
              puts $py_output
              exit 1
            }

            set py_success 1
          }

          expect {
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: Prompt not received after exit code check"; exit 1 }
            eof { puts "FAILURE: SSH session closed after exit code check"; exit 1 }
          }

          send "exit\r"
          expect eof
          EOF

          chmod +x /tmp/ssh_login_${{ github.run_id }}.exp
          echo "Connecting to SRF host via SSH..."

          set +e
          /usr/bin/expect /tmp/ssh_login_${{ github.run_id }}.exp
          SSH_EXIT=$?
          set -e

          rm -f /tmp/ssh_login_${{ github.run_id }}.exp

          if [ $SSH_EXIT -eq 0 ]; then
            echo "SUCCESS: SSH login and command executed successfully"
          else
            echo "FAILURE: SSH connection failed with exit code: $SSH_EXIT"
            exit $SSH_EXIT
          fi

      - name: Send SRF Login Notification
        if: ${{ inputs.callback_url != '' }}
        env:
          SRF_HOST: ${{ inputs.srf_host }}
          SRF_USER: ${{ inputs.srf_user }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Sending SRF login notification..."

          CALLBACK_URL="${{ inputs.callback_url }}"
          SESSION_ID="${{ inputs.session_id }}"

          if [ -n "$CALLBACK_URL" ]; then
            PAYLOAD=$(printf '{"session_id":"%s","status":"srf_login_completed","message":"SRF login process completed","workflow_run_id":"%s","timestamp":"%s","trigger_source":"%s","srf_login_details":{"host":"%s","user":"%s","login_timestamp":"%s"}}' \
              "$SESSION_ID" \
              "${{ github.run_id }}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${{ inputs.trigger_source }}" \
              "$SRF_HOST" \
              "$SRF_USER" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)")

            curl --noproxy 127.0.0.1 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "Failed to send SRF login notification"
          else
            echo "No callback URL provided, skipping notification"
          fi
