name: SRF SSH Login - Test

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
    secrets:
      SRF_HOST:
        required: true
      SRF_USERNAME:
        required: true
      SRF_PASSWORD:
        required: true

jobs:
  srf-login:
    name: SRF SSH Login
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Session Info Display
        if: ${{ inputs.session_id != '' }}
        shell: bash
        run: |
          echo "Session ID: ${{ inputs.session_id }}"
          echo "Triggered by: ${{ inputs.trigger_source }}"
          echo "Callback URL: ${{ inputs.callback_url }}"

      - name: SSH into SRF host and run deploy_reboot_wrapper.py
        env:
          SRF_HOST: ${{ secrets.SRF_HOST }}
          SRF_USER: ${{ secrets.SRF_USERNAME }}
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "================================================="
          echo "  SRF SSH Login - Post Build Auto Login"
          echo "================================================="

          cat > /tmp/ssh_login_${{ github.run_id }}.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 3000
          set srf_host $env(SRF_HOST)
          set srf_user $env(SRF_USER)
          set password $env(SRF_PASSWORD)

          if {$srf_host eq ""} {
            set srf_host "10.138.186.198"
          }
          if {$srf_user eq ""} {
            set srf_user "CEFLS_User"
          }

          set prompt_re {(?m).*[>#] ?$}

          puts "Connecting to $srf_user@$srf_host"

          proc run_cmd {cmd prompt_re} {
            send "$cmd\r"
            expect {
              -re $prompt_re { return 0 }
              -re "(?i)permission denied" {
                puts "FAILURE: Permission denied while running: $cmd"
                exit 13
              }
              timeout {
                puts "FAILURE: Command timed out: $cmd"
                exit 124
              }
              eof {
                catch wait result
                set rc [lindex $result 3]
                puts "FAILURE: SSH closed while running: $cmd (rc=$rc)"
                exit $rc
              }
            }
          }

          spawn ssh -T -o StrictHostKeyChecking=no $srf_user@$srf_host

          expect {
            -re "(?i)are you sure you want to continue connecting" {
              send "yes\r"
              exp_continue
            }
            -re "(?i)password:" {
              send "$password\r"
              exp_continue
            }
            -re "(?i)permission denied" {
              puts "FAILURE: Permission denied"
              exit 13
            }
            timeout {
              puts "FAILURE: Connection timed out"
              exit 124
            }
            eof {
              catch wait result
              set rc [lindex $result 3]
              puts "FAILURE: SSH closed during login (rc=$rc)"
              exit $rc
            }
            -re $prompt_re { }
          }

          run_cmd "whoami" $prompt_re
          run_cmd "if exist C:\\pkummara\\scripts\\deploy_reboot_wrapper.py (set DEPLOY_SCRIPT=C:\\pkummara\\scripts\\deploy_reboot_wrapper.py) else if exist %USERPROFILE%\\scripts\\deploy_reboot_wrapper.py (set DEPLOY_SCRIPT=%USERPROFILE%\\scripts\\deploy_reboot_wrapper.py) else if exist C:\\Users\\CEFLS_User\\scripts\\deploy_reboot_wrapper.py (set DEPLOY_SCRIPT=C:\\Users\\CEFLS_User\\scripts\\deploy_reboot_wrapper.py) else (echo DEPLOY_SCRIPT_NOT_FOUND & exit /b 2)" $prompt_re
          run_cmd "echo Using deploy script: %DEPLOY_SCRIPT%" $prompt_re
          run_cmd "if not exist C:\\Python310\\python.exe (echo PYTHON_NOT_FOUND & exit /b 4)" $prompt_re
          run_cmd "C:\\Python310\\python.exe -u %DEPLOY_SCRIPT% || (echo DEPLOY_RUN_FAILED & exit /b 3)" $prompt_re

          send -- "exit\r"
          expect eof
          catch wait result
          set rc [lindex $result 3]

          if {$rc == 2} {
            puts "FAILURE: deploy_reboot_wrapper.py not found in expected directories"
            exit 12
          }
          if {$rc == 3} {
            puts "FAILURE: deploy_reboot_wrapper.py execution failed"
            exit 14
          }
          if {$rc == 4} {
            puts "FAILURE: C:\\Python310\\python.exe not found"
            exit 15
          }

          exit $rc
          EOF

          chmod +x /tmp/ssh_login_${{ github.run_id }}.exp
          echo "Connecting to SRF host via SSH..."
          /usr/bin/expect /tmp/ssh_login_${{ github.run_id }}.exp
          SSH_EXIT=$?
          rm -f /tmp/ssh_login_${{ github.run_id }}.exp

          if [ $SSH_EXIT -eq 0 ]; then
            echo "SUCCESS: SSH login and command executed successfully"
          else
            echo "FAILURE: SSH connection failed with exit code: $SSH_EXIT"
            exit $SSH_EXIT
          fi

      - name: Send SRF Login Notification
        if: ${{ inputs.callback_url != '' }}
        env:
          SRF_HOST: ${{ secrets.SRF_HOST }}
          SRF_USER: ${{ secrets.SRF_USERNAME }}
        shell: bash
        run: |
          echo "Sending SRF login notification..."

          CALLBACK_URL="${{ inputs.callback_url }}"
          SESSION_ID="${{ inputs.session_id }}"
          SRF_HOST="${SRF_HOST}"
          SRF_USER="${SRF_USER}"

          if [ -n "$CALLBACK_URL" ]; then
            PAYLOAD=$(printf '{"session_id":"%s","status":"srf_login_completed","message":"SRF login process completed","workflow_run_id":"%s","timestamp":"%s","trigger_source":"%s","srf_login_details":{"host":"%s","user":"%s","login_timestamp":"%s"}}' \
              "$SESSION_ID" \
              "${{ github.run_id }}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${{ inputs.trigger_source }}" \
              "$SRF_HOST" \
              "$SRF_USER" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            curl --noproxy 127.0.0.1 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "Failed to send SRF login notification"
          else
            echo "No callback URL provided, skipping notification"
          fi
