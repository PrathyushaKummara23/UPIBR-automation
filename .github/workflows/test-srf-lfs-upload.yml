name: SRF Artifact Upload

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (example: 836003C4)"
        required: true
        type: string
      src_release_dir:
        description: "Source release directory"
        required: false
        default: "/nfs/site/disks/dcsg_0729/patches/SRF/C0/build"
        type: string
      inc_basename:
        description: "Base file name without extension (example: m_01_a06f3_836003c4)"
        required: true
        type: string

jobs:
  srf-artifact-upload:
    name: Prepare and upload SRF zip artifacts
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      BUILD_ID: ${{ inputs.build_id }}
      ROOT_RELEASE_BASE: ${{ inputs.src_release_dir }}
      INC_BASENAME: ${{ inputs.inc_basename }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare zipped SRF files
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          LOG_FILE="${RUNNER_TEMP}/test-srf-artifact-upload.log"
          exec > >(tee -a "${LOG_FILE}") 2>&1

          echo "=== Prepare zipped SRF files ==="

          SRC_RELEASE_DIR="${ROOT_RELEASE_BASE}/${BUILD_ID}/release"
          INC_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.pdb"
          ARTIFACT_DIR="/tmp/srf-release-collaterals/${BUILD_ID}"

          echo "SRC_RELEASE_DIR=${SRC_RELEASE_DIR}"
          echo "INC_FILE=${INC_FILE}"
          echo "PDB_FILE=${PDB_FILE}"
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}"

          # Preconditions
          test -d "${SRC_RELEASE_DIR}" || { echo "ERROR: Source directory missing: ${SRC_RELEASE_DIR}"; exit 1; }
          test -f "${INC_FILE}" || { echo "ERROR: INC file missing: ${INC_FILE}"; exit 1; }
          test -f "${PDB_FILE}" || { echo "ERROR: PDB file missing: ${PDB_FILE}"; exit 1; }

          mkdir -p "${ARTIFACT_DIR}"

          echo "=== Source file sizes ==="
          ls -lh "${INC_FILE}" "${PDB_FILE}"

          echo "=== Create zip files ==="
          INC_ZIP="${ARTIFACT_DIR}/$(basename "${INC_FILE}").zip"
          PDB_ZIP="${ARTIFACT_DIR}/$(basename "${PDB_FILE}").zip"

          zip -j "${INC_ZIP}" "${INC_FILE}"
          zip -j "${PDB_ZIP}" "${PDB_FILE}"

          echo "=== Zip sizes ==="
          ls -lh "${INC_ZIP}" "${PDB_ZIP}"

          # Ensure readability for upload action on self-hosted environments
          chmod 644 "${INC_ZIP}" "${PDB_ZIP}"

          # Export for later steps
          echo "SRC_RELEASE_DIR=${SRC_RELEASE_DIR}" >> "${GITHUB_ENV}"
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}" >> "${GITHUB_ENV}"
          echo "INC_FILE=${INC_FILE}" >> "${GITHUB_ENV}"
          echo "PDB_FILE=${PDB_FILE}" >> "${GITHUB_ENV}"
          echo "INC_ZIP=${INC_ZIP}" >> "${GITHUB_ENV}"
          echo "PDB_ZIP=${PDB_ZIP}" >> "${GITHUB_ENV}"
          echo "LOG_FILE=${LOG_FILE}" >> "${GITHUB_ENV}"

          echo "Zipped files prepared successfully"

      - name: Verify zipped outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verify zipped outputs ==="
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}"
          echo "INC_ZIP=${INC_ZIP}"
          echo "PDB_ZIP=${PDB_ZIP}"

          test -d "${ARTIFACT_DIR}" || { echo "ERROR: Missing artifact directory: ${ARTIFACT_DIR}"; exit 1; }
          test -f "${INC_ZIP}" || { echo "ERROR: Missing file: ${INC_ZIP}"; exit 1; }
          test -f "${PDB_ZIP}" || { echo "ERROR: Missing file: ${PDB_ZIP}"; exit 1; }

          ls -lah "${ARTIFACT_DIR}"

      - name: Upload SRF zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: srf-release-${{ env.BUILD_ID }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            ${{ env.INC_ZIP }}
            ${{ env.PDB_ZIP }}

      - name: Upload preparation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srf-upload-log-${{ env.BUILD_ID }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ env.LOG_FILE }}
