name: Test SRF Git LFS Upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-lfs-upload:
    runs-on: [self-hosted, node16]

    steps:
      - name: Checkout repository
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            echo "REPO_PUSH_TOKEN is missing"
            exit 1
          fi

          REPO_URL="https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          WORKDIR="${GITHUB_WORKSPACE}"
          PARENT_DIR="$(dirname "$WORKDIR")"
          REPO_DIR="$(basename "$WORKDIR")"
          BRANCH="${{ github.ref_name }}"

          mkdir -p "$PARENT_DIR"
          cd "$PARENT_DIR"

          if [ -d "$WORKDIR/.git" ]; then
            cd "$WORKDIR"
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
          else
            rm -rf "$WORKDIR"
            git clone --depth=1 --branch "$BRANCH" "$REPO_URL" "$REPO_DIR"
            cd "$WORKDIR"
          fi

          git config --global --add safe.directory "$WORKDIR"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Prepare zipped files, capture debug log, and push
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="${{ github.ref_name }}"
          REPO_URL="https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${{ github.repository }}.git"

          DEBUG_DIR="output_paths/lfs_debug"
          DEBUG_LOG="${DEBUG_DIR}/test-srf-lfs-upload.log"

          mkdir -p "$DEBUG_DIR"
          : > "$DEBUG_LOG"

          log() {
            echo "$1" | tee -a "$DEBUG_LOG"
          }

          trap 'rc=$?; log ""; log "FAILED with exit code $rc"; git status --short >> "$DEBUG_LOG" 2>&1 || true; exit $rc' ERR

          log "=== Test SRF Git LFS Upload Debug ==="
          log "Repository: ${{ github.repository }}"
          log "Branch: $BRANCH"
          log "Workspace: $GITHUB_WORKSPACE"

          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            log "REPO_PUSH_TOKEN is missing"
            exit 1
          fi

          log ""
          log "=== Git / LFS versions ==="
          git --version >> "$DEBUG_LOG" 2>&1
          git lfs version >> "$DEBUG_LOG" 2>&1

          log ""
          log "=== Configure Git LFS ==="
          git lfs install --local >> "$DEBUG_LOG" 2>&1
          git lfs track "*.zip" >> "$DEBUG_LOG" 2>&1

          log ".gitattributes contents:"
          cat .gitattributes >> "$DEBUG_LOG" 2>&1 || true

          CURRENT_VERSION="836003C4"
          CURRENT_VERSION_LOWER="$(echo "$CURRENT_VERSION" | tr '[:upper:]' '[:lower:]')"
          SRC_RELEASE_DIR="/nfs/site/disks/dcsg_0729/patches/SRF/C0/build/${CURRENT_VERSION}/release"

          INC_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb"

          TARGET_DIR="output_paths/SRF_release_collaterals/${CURRENT_VERSION}"
          INC_ZIP="${TARGET_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc.zip"
          PDB_ZIP="${TARGET_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb.zip"

          log ""
          log "=== Source files ==="
          log "SRC_RELEASE_DIR=$SRC_RELEASE_DIR"
          log "INC_FILE=$INC_FILE"
          log "PDB_FILE=$PDB_FILE"

          [ -d "$SRC_RELEASE_DIR" ] || { log "Release directory missing"; exit 1; }
          [ -f "$INC_FILE" ] || { log "INC file missing"; exit 1; }
          [ -f "$PDB_FILE" ] || { log "PDB file missing"; exit 1; }

          ls -lh "$INC_FILE" >> "$DEBUG_LOG" 2>&1
          ls -lh "$PDB_FILE" >> "$DEBUG_LOG" 2>&1

          mkdir -p "$TARGET_DIR"
          rm -f "$INC_ZIP" "$PDB_ZIP"

          log ""
          log "=== Create zip files ==="
          zip -j "$INC_ZIP" "$INC_FILE" >> "$DEBUG_LOG" 2>&1
          zip -j "$PDB_ZIP" "$PDB_FILE" >> "$DEBUG_LOG" 2>&1

          [ -f "$INC_ZIP" ] || { log "INC zip not created"; exit 1; }
          [ -f "$PDB_ZIP" ] || { log "PDB zip not created"; exit 1; }

          log "Created: $INC_ZIP"
          log "Created: $PDB_ZIP"
          ls -lh "$INC_ZIP" >> "$DEBUG_LOG" 2>&1
          ls -lh "$PDB_ZIP" >> "$DEBUG_LOG" 2>&1

          log ""
          log "=== Git add ==="
          git add .gitattributes >> "$DEBUG_LOG" 2>&1 || true
          git add "$DEBUG_LOG" >> "$DEBUG_LOG" 2>&1
          git add "$INC_ZIP" >> "$DEBUG_LOG" 2>&1
          git add "$PDB_ZIP" >> "$DEBUG_LOG" 2>&1

          log "Git status after add:"
          git status --short >> "$DEBUG_LOG" 2>&1

          if git diff --cached --quiet; then
            log "No changes to commit"
            git remote set-url origin "$REPO_URL"
            git commit --allow-empty -m "Add LFS debug log for 836003C4 test" >> "$DEBUG_LOG" 2>&1
            git push origin "$BRANCH" >> "$DEBUG_LOG" 2>&1
            exit 0
          fi

          log ""
          log "=== Cached diff stat ==="
          git diff --cached --stat >> "$DEBUG_LOG" 2>&1

          log ""
          log "=== Commit ==="
          git commit -m "Add SRF zipped collateral files for 836003C4 via Git LFS" >> "$DEBUG_LOG" 2>&1

          log ""
          log "=== LFS tracked files ==="
          git lfs ls-files >> "$DEBUG_LOG" 2>&1 || true

          log ""
          log "=== LFS env ==="
          git lfs env >> "$DEBUG_LOG" 2>&1 || true

          log ""
          log "=== Push ==="
          git remote set-url origin "$REPO_URL"
          git push origin "$BRANCH" >> "$DEBUG_LOG" 2>&1

          log ""
          log "Push completed successfully"
