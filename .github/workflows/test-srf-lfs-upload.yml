name: Test SRF Git LFS Upload

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBUG_LOG_PATH: /nfs/site/disks/dcsg_0729/users/pkummara/test-srf-lfs-upload.log

jobs:
  test-lfs-upload:
    runs-on: [self-hosted, node16]

    steps:
      - name: Checkout repository
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          LOG_FILE="${{ env.DEBUG_LOG_PATH }}"
          mkdir -p "$(dirname "$LOG_FILE")"
          : > "$LOG_FILE"

          log() {
            echo "$1" | tee -a "$LOG_FILE"
          }

          trap 'rc=$?; log ""; log "FAILED in Checkout repository with exit code $rc"; exit $rc' ERR

          log "=== Checkout repository ==="

          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            log "REPO_PUSH_TOKEN is missing"
            exit 1
          fi

          REPO_URL="https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          WORKDIR="${GITHUB_WORKSPACE}"
          PARENT_DIR="$(dirname "$WORKDIR")"
          REPO_DIR="$(basename "$WORKDIR")"
          BRANCH="${{ github.ref_name }}"

          log "Repository: ${{ github.repository }}"
          log "Branch: $BRANCH"
          log "Workdir: $WORKDIR"

          mkdir -p "$PARENT_DIR"
          cd "$PARENT_DIR"

          if [ -d "$WORKDIR/.git" ]; then
            cd "$WORKDIR"
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$BRANCH" >> "$LOG_FILE" 2>&1
            git checkout "$BRANCH" >> "$LOG_FILE" 2>&1
            git reset --hard "origin/$BRANCH" >> "$LOG_FILE" 2>&1
          else
            rm -rf "$WORKDIR"
            git clone --depth=1 --branch "$BRANCH" "$REPO_URL" "$REPO_DIR" >> "$LOG_FILE" 2>&1
            cd "$WORKDIR"
          fi

          git config --global --add safe.directory "$WORKDIR" >> "$LOG_FILE" 2>&1
          git config user.name "GitHub Action" >> "$LOG_FILE" 2>&1
          git config user.email "action@github.com" >> "$LOG_FILE" 2>&1

          log "Checkout completed"

      - name: Prepare zipped files, configure LFS, commit and push
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          LOG_FILE="${{ env.DEBUG_LOG_PATH }}"
          BRANCH="${{ github.ref_name }}"
          REPO_URL="https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${{ github.repository }}.git"

          log() {
            echo "$1" | tee -a "$LOG_FILE"
          }

          trap 'rc=$?; log ""; log "FAILED in Prepare zipped files, configure LFS, commit and push with exit code $rc"; log "=== git status --short ==="; git status --short >> "$LOG_FILE" 2>&1 || true; log "=== git lfs env ==="; git lfs env >> "$LOG_FILE" 2>&1 || true; exit $rc' ERR

          log ""
          log "=== Prepare zipped files, configure LFS, commit and push ==="

          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            log "REPO_PUSH_TOKEN is missing"
            exit 1
          fi

          log "=== Git versions ==="
          git --version >> "$LOG_FILE" 2>&1
          git lfs version >> "$LOG_FILE" 2>&1

          log "=== Install/configure Git LFS ==="
          git lfs install --local >> "$LOG_FILE" 2>&1
          git lfs track "*.zip" >> "$LOG_FILE" 2>&1

          log "=== .gitattributes ==="
          cat .gitattributes >> "$LOG_FILE" 2>&1 || true

          CURRENT_VERSION="836003C4"
          CURRENT_VERSION_LOWER="$(echo "$CURRENT_VERSION" | tr '[:upper:]' '[:lower:]')"
          SRC_RELEASE_DIR="/nfs/site/disks/dcsg_0729/patches/SRF/C0/build/${CURRENT_VERSION}/release"

          INC_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb"

          TARGET_DIR="output_paths/SRF_release_collaterals/${CURRENT_VERSION}"
          INC_ZIP="${TARGET_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc.zip"
          PDB_ZIP="${TARGET_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb.zip"

          log "=== Source paths ==="
          log "SRC_RELEASE_DIR=$SRC_RELEASE_DIR"
          log "INC_FILE=$INC_FILE"
          log "PDB_FILE=$PDB_FILE"
          log "TARGET_DIR=$TARGET_DIR"
          log "INC_ZIP=$INC_ZIP"
          log "PDB_ZIP=$PDB_ZIP"

          [ -d "$SRC_RELEASE_DIR" ] || { log "Release directory missing"; exit 1; }
          [ -f "$INC_FILE" ] || { log "INC file missing"; exit 1; }
          [ -f "$PDB_FILE" ] || { log "PDB file missing"; exit 1; }

          log "=== Source file sizes ==="
          ls -lh "$INC_FILE" >> "$LOG_FILE" 2>&1
          ls -lh "$PDB_FILE" >> "$LOG_FILE" 2>&1

          mkdir -p "$TARGET_DIR"
          rm -f "$INC_ZIP" "$PDB_ZIP"

          log "=== Create zip files ==="
          zip -j "$INC_ZIP" "$INC_FILE" >> "$LOG_FILE" 2>&1
          zip -j "$PDB_ZIP" "$PDB_FILE" >> "$LOG_FILE" 2>&1

          [ -f "$INC_ZIP" ] || { log "INC zip not created"; exit 1; }
          [ -f "$PDB_ZIP" ] || { log "PDB zip not created"; exit 1; }

          log "=== Zip sizes ==="
          ls -lh "$INC_ZIP" >> "$LOG_FILE" 2>&1
          ls -lh "$PDB_ZIP" >> "$LOG_FILE" 2>&1

          log "=== git add ==="
          git add .gitattributes >> "$LOG_FILE" 2>&1 || true
          git add "$INC_ZIP" >> "$LOG_FILE" 2>&1
          git add "$PDB_ZIP" >> "$LOG_FILE" 2>&1

          log "=== git status --short after add ==="
          git status --short >> "$LOG_FILE" 2>&1

          if git diff --cached --quiet; then
            log "No changes to commit"
            exit 0
          fi

          log "=== git diff --cached --stat ==="
          git diff --cached --stat >> "$LOG_FILE" 2>&1

          log "=== git commit ==="
          git commit -m "Add SRF zipped collateral files for 836003C4 via Git LFS" >> "$LOG_FILE" 2>&1

          log "=== git lfs ls-files ==="
          git lfs ls-files >> "$LOG_FILE" 2>&1 || true

          log "=== git lfs env ==="
          git lfs env >> "$LOG_FILE" 2>&1 || true

          log "=== git remote set-url ==="
          git remote set-url origin "$REPO_URL" >> "$LOG_FILE" 2>&1
          git remote -v >> "$LOG_FILE" 2>&1

          log "=== git push ==="
          git push origin "$BRANCH" >> "$LOG_FILE" 2>&1

          log "Push completed successfully"

      - name: Final marker
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow finished. Check log file at: ${{ env.DEBUG_LOG_PATH }}"
