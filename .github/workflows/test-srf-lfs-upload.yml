- name: Commit and push work branch
  shell: bash
  run: |
    set -euo pipefail
    cd "${WORK_REPO}"

    unset http_proxy
    unset HTTP_PROXY
    unset https_proxy
    unset HTTPS_PROXY
    export no_proxy="github.com,api.github.com"
    export NO_PROXY="github.com,api.github.com"

    git config --global --unset-all http.proxy || true
    git config --global --unset-all https.proxy || true

    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add "release-collaterals/${BUILD_ID}"

    if git diff --cached --quiet; then
      echo "No changes to commit."
      echo "NO_CHANGES=true" >> "${GITHUB_ENV}"
      exit 0
    fi

    git commit -m "Add SRF collaterals for build ${BUILD_ID}"

    git remote set-url origin "https://

