name: Test SRF Git LFS Upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-lfs-upload:
    runs-on: [self-hosted, node16]

    steps:
      - name: Checkout repository
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          SUMMARY="$GITHUB_STEP_SUMMARY"
          say() { echo "$1"; echo "$1" >> "$SUMMARY"; }

          say "## Checkout repository"

          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            say "- REPO_PUSH_TOKEN is missing"
            exit 1
          fi

          REPO_URL="https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          WORKDIR="${GITHUB_WORKSPACE}"
          PARENT_DIR="$(dirname "$WORKDIR")"
          REPO_DIR="$(basename "$WORKDIR")"
          BRANCH="${{ github.ref_name }}"

          say "- Repository: \`${{ github.repository }}\`"
          say "- Branch: \`$BRANCH\`"
          say "- Workdir: \`$WORKDIR\`"

          mkdir -p "$PARENT_DIR"
          cd "$PARENT_DIR"

          if [ -d "$WORKDIR/.git" ]; then
            cd "$WORKDIR"
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
          else
            rm -rf "$WORKDIR"
            git clone --depth=1 --branch "$BRANCH" "$REPO_URL" "$REPO_DIR"
            cd "$WORKDIR"
          fi

          git config --global --add safe.directory "$WORKDIR"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          say "- Checkout completed"

      - name: Prepare and track zipped SRF files with Git LFS
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY="$GITHUB_STEP_SUMMARY"
          say() { echo "$1"; echo "$1" >> "$SUMMARY"; }

          say ""
          say "## Prepare zipped files and configure Git LFS"

          git lfs version >> "$SUMMARY" 2>&1
          git lfs install --local >> "$SUMMARY" 2>&1

          CURRENT_VERSION="836003C4"
          CURRENT_VERSION_LOWER="$(echo "$CURRENT_VERSION" | tr '[:upper:]' '[:lower:]')"
          SRC_RELEASE_DIR="/nfs/site/disks/dcsg_0729/patches/SRF/C0/build/${CURRENT_VERSION}/release"

          INC_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb"

          TARGET_DIR="output_paths/SRF_release_collaterals/${CURRENT_VERSION}"
          INC_ZIP="${TARGET_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc.zip"
          PDB_ZIP="${TARGET_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb.zip"

          say "- Source release dir: \`$SRC_RELEASE_DIR\`"
          say "- INC file: \`$INC_FILE\`"
          say "- PDB file: \`$PDB_FILE\`"

          [ -d "$SRC_RELEASE_DIR" ] || { say "- Release directory missing"; exit 1; }
          [ -f "$INC_FILE" ] || { say "- INC file missing"; exit 1; }
          [ -f "$PDB_FILE" ] || { say "- PDB file missing"; exit 1; }

          mkdir -p "$TARGET_DIR"
          rm -f "$INC_ZIP" "$PDB_ZIP"

          zip -j "$INC_ZIP" "$INC_FILE" >> "$SUMMARY" 2>&1
          zip -j "$PDB_ZIP" "$PDB_FILE" >> "$SUMMARY" 2>&1

          [ -f "$INC_ZIP" ] || { say "- INC zip not created"; exit 1; }
          [ -f "$PDB_ZIP" ] || { say "- PDB zip not created"; exit 1; }

          say "- INC zip size: \`$(ls -lh "$INC_ZIP" | awk '{print $5}')\`"
          say "- PDB zip size: \`$(ls -lh "$PDB_ZIP" | awk '{print $5}')\`"

          git lfs track "*.zip" >> "$SUMMARY" 2>&1

          say "- .gitattributes contents:"
          {
            echo '```text'
            cat .gitattributes
            echo '```'
          } >> "$SUMMARY"

      - name: Commit and push LFS files
        shell: bash
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          SUMMARY="$GITHUB_STEP_SUMMARY"
          say() { echo "$1"; echo "$1" >> "$SUMMARY"; }

          say ""
          say "## Commit and push LFS files"

          if [ -z "${REPO_PUSH_TOKEN:-}" ]; then
            say "- REPO_PUSH_TOKEN is missing"
            exit 1
          fi

          BRANCH="${{ github.ref_name }}"
          REPO_URL="https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${{ github.repository }}.git"

          git remote set-url origin "$REPO_URL"
          git remote -v >> "$SUMMARY" 2>&1 || true

          git add .gitattributes
          git add output_paths/SRF_release_collaterals/

          if git diff --cached --quiet; then
            say "- No changes to commit"
            exit 0
          fi

          say "- Cached changes:"
          {
            echo '```text'
            git status --short
            echo
            git diff --cached --stat
            echo '```'
          } >> "$SUMMARY"

          git commit -m "Add SRF zipped collateral files for 836003C4 via Git LFS" >> "$SUMMARY" 2>&1

          say "- Commit created"

          git lfs ls-files >> "$SUMMARY" 2>&1 || true
          say "- Attempting push"

          if git push origin "$BRANCH" >> "$SUMMARY" 2>&1; then
            say "- Push succeeded"
          else
            say "- Push failed"
            say "- Git LFS env:"
            {
              echo '```text'
              git lfs env || true
              echo '```'
            } >> "$SUMMARY"
            exit 1
          fi
