name: SRF Collateral Commit to Repo (Linux)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (example: 830003C4)"
        required: true
        type: string
      src_release_dir:
        description: "Source release directory base"
        required: true
        default: "/nfs/site/disks/dcsg_0729/patches/SRF/C0/build"
        type: string
      inc_basename:
        description: "Base file name without extension (example: m_01_a06f3_830003c4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  commit-collaterals:
    name: Zip and commit collaterals to repository
    runs-on: [self-hosted, Linux, X64, gnr_r1s-prod-runner]
    timeout-minutes: 30

    env:
      BUILD_ID: ${{ inputs.build_id }}
      ROOT_RELEASE_BASE: ${{ inputs.src_release_dir }}
      INC_BASENAME: ${{ inputs.inc_basename }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Prepare zipped SRF files
        shell: bash
        run: |
          set -euo pipefail

          SRC_RELEASE_DIR="${ROOT_RELEASE_BASE}/${BUILD_ID}/release"
          INC_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.pdb"
          WORK_DIR="${RUNNER_TEMP}/srf-release-collaterals/${BUILD_ID}"

          echo "SRC_RELEASE_DIR=${SRC_RELEASE_DIR}"
          echo "INC_FILE=${INC_FILE}"
          echo "PDB_FILE=${PDB_FILE}"
          echo "WORK_DIR=${WORK_DIR}"

          test -d "${SRC_RELEASE_DIR}" || { echo "Missing source dir: ${SRC_RELEASE_DIR}"; exit 1; }
          test -f "${INC_FILE}" || { echo "Missing file: ${INC_FILE}"; exit 1; }
          test -f "${PDB_FILE}" || { echo "Missing file: ${PDB_FILE}"; exit 1; }

          mkdir -p "${WORK_DIR}"

          INC_ZIP="${WORK_DIR}/$(basename "${INC_FILE}").zip"
          PDB_ZIP="${WORK_DIR}/$(basename "${PDB_FILE}").zip"

          zip -j "${INC_ZIP}" "${INC_FILE}"
          zip -j "${PDB_ZIP}" "${PDB_FILE}"

          test -f "${INC_ZIP}" || { echo "INC zip not created"; exit 1; }
          test -f "${PDB_ZIP}" || { echo "PDB zip not created"; exit 1; }

          echo "INC_ZIP=${INC_ZIP}" >> "${GITHUB_ENV}"
          echo "PDB_ZIP=${PDB_ZIP}" >> "${GITHUB_ENV}"

          ls -lah "${WORK_DIR}"

      - name: Commit zip files to repository via GitHub API
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${GH_REPO}"
          DEST_DIR="release-collaterals/${BUILD_ID}"

          upload_file () {
            local src_file="$1"
            local file_name
            local path
            local content_b64
            local get_code
            local sha
            local payload_file

            file_name="$(basename "${src_file}")"
            path="${DEST_DIR}/${file_name}"
            payload_file="/tmp/payload-${file_name}.json"

            # base64 as single line
            content_b64="$(base64 -w 0 "${src_file}")"

            # check if file exists (to include sha on update)
            get_code=$(curl -sS -o /tmp/existing.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/contents/${path}")

            if [ "${get_code}" = "200" ]; then
              sha="$(jq -r '.sha' /tmp/existing.json)"
              jq -n \
                --arg msg "Add SRF collateral ${file_name} for build ${BUILD_ID}" \
                --arg content "${content_b64}" \
                --arg sha "${sha}" \
                '{
                  message: $msg,
                  content: $content,
                  sha: $sha
                }' > "${payload_file}"
            elif [ "${get_code}" = "404" ]; then
              jq -n \
                --arg msg "Add SRF collateral ${file_name} for build ${BUILD_ID}" \
                --arg content "${content_b64}" \
                '{
                  message: $msg,
                  content: $content
                }' > "${payload_file}"
            else
              echo "Failed checking existing file ${path}, HTTP ${get_code}"
              cat /tmp/existing.json
              exit 1
            fi

            put_code=$(curl -sS -o /tmp/put_result.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/contents/${path}" \
              -d @"${payload_file}")

            if [ "${put_code}" != "200" ] && [ "${put_code}" != "201" ]; then
              echo "Upload failed for ${path}, HTTP ${put_code}"
              cat /tmp/put_result.json
              exit 1
            fi

            echo "Committed: ${path}"
          }

          upload_file "${INC_ZIP}"
          upload_file "${PDB_ZIP}"

      - name: Print repo paths
        shell: bash
        run: |
          echo "https://github.com/${GH_REPO}/tree/${GITHUB_REF_NAME}/release-collaterals/${BUILD_ID}"
