name: SRF Collateral Commit via Git Push (Linux)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (example: 830003C4)"
        required: true
        type: string
      src_release_dir:
        description: "Source release directory base"
        required: true
        default: "/nfs/site/disks/dcsg_0729/patches/SRF/C0/build"
        type: string
      inc_basename:
        description: "Base file name without extension (example: m_01_a06f3_830003c4)"
        required: true
        type: string
      target_branch:
        description: "Optional branch to push to (leave empty for repo default branch)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  push-collaterals:
    runs-on: [self-hosted, Linux, X64, gnr_r1s-prod-runner]
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ inputs.build_id }}
      ROOT_RELEASE_BASE: ${{ inputs.src_release_dir }}
      INC_BASENAME: ${{ inputs.inc_basename }}
      TARGET_BRANCH_INPUT: ${{ inputs.target_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          command -v git >/dev/null || { echo "git not found"; exit 1; }
          command -v zip >/dev/null || { echo "zip not found"; exit 1; }
          command -v jq >/dev/null || { echo "jq not found"; exit 1; }

      - name: Resolve target branch
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${TARGET_BRANCH_INPUT}" ]; then
            TARGET_BRANCH="${TARGET_BRANCH_INPUT}"
          else
            TARGET_BRANCH="$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_REPO}" | jq -r '.default_branch')"
          fi

          test -n "${TARGET_BRANCH}" && [ "${TARGET_BRANCH}" != "null" ] || { echo "Could not resolve target branch"; exit 1; }

          echo "Using TARGET_BRANCH=${TARGET_BRANCH}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> "${GITHUB_ENV}"

      - name: Prepare zipped SRF files
        shell: bash
        run: |
          set -euo pipefail

          SRC_RELEASE_DIR="${ROOT_RELEASE_BASE}/${BUILD_ID}/release"
          INC_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.pdb"
          ZIP_DIR="${RUNNER_TEMP}/srf-release-collaterals/${BUILD_ID}"

          test -d "${SRC_RELEASE_DIR}" || { echo "Missing source directory: ${SRC_RELEASE_DIR}"; exit 1; }
          test -f "${INC_FILE}" || { echo "Missing INC file: ${INC_FILE}"; exit 1; }
          test -f "${PDB_FILE}" || { echo "Missing PDB file: ${PDB_FILE}"; exit 1; }

          mkdir -p "${ZIP_DIR}"

          INC_ZIP="${ZIP_DIR}/$(basename "${INC_FILE}").zip"
          PDB_ZIP="${ZIP_DIR}/$(basename "${PDB_FILE}").zip"

          zip -j "${INC_ZIP}" "${INC_FILE}"
          zip -j "${PDB_ZIP}" "${PDB_FILE}"

          echo "INC_ZIP=${INC_ZIP}" >> "${GITHUB_ENV}"
          echo "PDB_ZIP=${PDB_ZIP}" >> "${GITHUB_ENV}"

      - name: Clone target branch
        shell: bash
        run: |
          set -euo pipefail

          WORK="${RUNNER_TEMP}/repo-work-${BUILD_ID}"
          rm -rf "${WORK}"
          mkdir -p "${WORK}"

          git -c http.sslVerify=true clone --branch "${TARGET_BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            "${WORK}"

          echo "WORK_REPO=${WORK}" >> "${GITHUB_ENV}"

      - name: Copy collaterals into repository path
        shell: bash
        run: |
          set -euo pipefail

          DEST_DIR="${WORK_REPO}/release-collaterals/${BUILD_ID}"
          mkdir -p "${DEST_DIR}"

          cp -f "${INC_ZIP}" "${DEST_DIR}/"
          cp -f "${PDB_ZIP}" "${DEST_DIR}/"

          ls -lah "${DEST_DIR}"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd "${WORK_REPO}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "release-collaterals/${BUILD_ID}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add SRF collaterals for build ${BUILD_ID}"
          git push origin "${TARGET_BRANCH}"

      - name: Print committed path
        shell: bash
        run: |
          echo "https://github.com/${GH_REPO}/tree/${TARGET_BRANCH}/release-collaterals/${BUILD_ID}"
