name: SRF Artifact Upload (Linux, no Node actions)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (example: 830003C4)"
        required: true
        type: string
      src_release_dir:
        description: "Source release directory base"
        required: true
        default: "/nfs/site/disks/dcsg_0729/patches/SRF/C0/build"
        type: string
      inc_basename:
        description: "Base file name without extension (example: m_01_a06f3_830003c4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  srf-artifact-upload:
    runs-on: [self-hosted, Linux, X64, gnr_r1s-prod-runner]
    timeout-minutes: 30

    env:
      BUILD_ID: ${{ inputs.build_id }}
      ROOT_RELEASE_BASE: ${{ inputs.src_release_dir }}
      INC_BASENAME: ${{ inputs.inc_basename }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Prepare zipped SRF files
        shell: bash
        run: |
          set -euo pipefail

          SRC_RELEASE_DIR="${ROOT_RELEASE_BASE}/${BUILD_ID}/release"
          INC_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.pdb"
          ARTIFACT_DIR="${RUNNER_TEMP}/srf-release-collaterals/${BUILD_ID}"

          echo "SRC_RELEASE_DIR=${SRC_RELEASE_DIR}"
          echo "INC_FILE=${INC_FILE}"
          echo "PDB_FILE=${PDB_FILE}"
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}"

          test -d "${SRC_RELEASE_DIR}"
          test -f "${INC_FILE}"
          test -f "${PDB_FILE}"

          mkdir -p "${ARTIFACT_DIR}"

          INC_ZIP="${ARTIFACT_DIR}/$(basename "${INC_FILE}").zip"
          PDB_ZIP="${ARTIFACT_DIR}/$(basename "${PDB_FILE}").zip"

          zip -j "${INC_ZIP}" "${INC_FILE}"
          zip -j "${PDB_ZIP}" "${PDB_FILE}"

          test -f "${INC_ZIP}"
          test -f "${PDB_ZIP}"

          echo "INC_ZIP=${INC_ZIP}" >> "${GITHUB_ENV}"
          echo "PDB_ZIP=${PDB_ZIP}" >> "${GITHUB_ENV}"

          ls -lah "${ARTIFACT_DIR}"

      - name: Create/ensure release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="srf-${BUILD_ID}"
          API="https://api.github.com/repos/${GH_REPO}"

          # Try to create release. If it exists, continue.
          http_code=$(curl -sS -o /tmp/release_create.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"SRF ${BUILD_ID}\",\"draft\":false,\"prerelease\":false}")

          if [ "${http_code}" != "201" ] && [ "${http_code}" != "422" ]; then
            echo "Release create failed HTTP ${http_code}"
            cat /tmp/release_create.json
            exit 1
          fi

          # Get release by tag and extract upload_url
          curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases/tags/${TAG}" > /tmp/release_get.json

          UPLOAD_URL=$(python - <<'PY'
import json
d=json.load(open('/tmp/release_get.json'))
print(d["upload_url"].split("{")[0])
PY
)
          echo "UPLOAD_URL=${UPLOAD_URL}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Upload zip assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upload_one () {
            local file="$1"
            local name
            name="$(basename "$file")"

            # delete existing asset with same name if exists
            curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_REPO}/releases/tags/${TAG}" > /tmp/release_assets.json

            asset_id=$(python - "$name" <<'PY'
import json,sys
name=sys.argv[1]
d=json.load(open('/tmp/release_assets.json'))
for a in d.get("assets",[]):
    if a.get("name")==name:
        print(a.get("id"))
        break
PY
)
            if [ -n "${asset_id:-}" ]; then
              curl -sS -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_REPO}/releases/assets/${asset_id}" >/dev/null
            fi

            curl -sS -f \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/zip" \
              --data-binary @"${file}" \
              "${UPLOAD_URL}?name=${name}" >/dev/null

            echo "Uploaded: ${name}"
          }

          upload_one "${INC_ZIP}"
          upload_one "${PDB_ZIP}"

      - name: Print release URL
        shell: bash
        run: |
          echo "https://github.com/${GH_REPO}/releases/tag/${TAG}"
