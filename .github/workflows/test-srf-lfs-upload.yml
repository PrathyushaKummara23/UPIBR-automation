name: Test Basic Git Push

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBUG_LOG_PATH: /nfs/site/disks/dcsg_0729/users/pkummara/test-basic-push.log
  TARGET_BRANCH: copilot/test-basic-push

jobs:
  test-basic-push:
    runs-on: [self-hosted, node16]

    steps:
      - name: Checkout repository
        shell: bash
        env:
          RELEASE_COLLATERALS_PUSH_TOKEN_SRF: ${{ secrets.release_collaterals_push_token_srf }}
        run: |
          set -euo pipefail

          LOG_FILE="${{ env.DEBUG_LOG_PATH }}"
          mkdir -p "$(dirname "$LOG_FILE")"
          : > "$LOG_FILE"

          log() {
            echo "$1" | tee -a "$LOG_FILE"
          }

          trap 'rc=$?; log ""; log "FAILED in Checkout repository with exit code $rc"; exit $rc' ERR

          log "=== Checkout repository ==="

          if [ -z "${RELEASE_COLLATERALS_PUSH_TOKEN_SRF:-}" ]; then
            log "release_collaterals_push_token_srf is missing"
            exit 1
          fi

          REPO_URL="https://x-access-token:${RELEASE_COLLATERALS_PUSH_TOKEN_SRF}@github.com/${{ github.repository }}.git"
          WORKDIR="${GITHUB_WORKSPACE}"
          PARENT_DIR="$(dirname "$WORKDIR")"
          REPO_DIR="$(basename "$WORKDIR")"
          BASE_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="${{ env.TARGET_BRANCH }}"

          log "Repository: ${{ github.repository }}"
          log "Base branch: $BASE_BRANCH"
          log "Target branch: $TARGET_BRANCH"
          log "Workdir: $WORKDIR"

          mkdir -p "$PARENT_DIR"
          cd "$PARENT_DIR"

          if [ -d "$WORKDIR/.git" ]; then
            cd "$WORKDIR"
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$BASE_BRANCH" >> "$LOG_FILE" 2>&1
            git checkout "$BASE_BRANCH" >> "$LOG_FILE" 2>&1
            git reset --hard "origin/$BASE_BRANCH" >> "$LOG_FILE" 2>&1
          else
            rm -rf "$WORKDIR"
            git clone --depth=1 --branch "$BASE_BRANCH" "$REPO_URL" "$REPO_DIR" >> "$LOG_FILE" 2>&1
            cd "$WORKDIR"
          fi

          git config --global --add safe.directory "$WORKDIR" >> "$LOG_FILE" 2>&1
          git config user.name "GitHub Action" >> "$LOG_FILE" 2>&1
          git config user.email "action@github.com" >> "$LOG_FILE" 2>&1

          git checkout -B "$TARGET_BRANCH" >> "$LOG_FILE" 2>&1

          log "Checkout completed"

      - name: Create test file and push branch
        shell: bash
        env:
          RELEASE_COLLATERALS_PUSH_TOKEN_SRF: ${{ secrets.release_collaterals_push_token_srf }}
        run: |
          set -euo pipefail

          LOG_FILE="${{ env.DEBUG_LOG_PATH }}"
          TARGET_BRANCH="${{ env.TARGET_BRANCH }}"
          REPO_URL="https://x-access-token:${RELEASE_COLLATERALS_PUSH_TOKEN_SRF}@github.com/${{ github.repository }}.git"

          log() {
            echo "$1" | tee -a "$LOG_FILE"
          }

          trap 'rc=$?; log ""; log "FAILED in Create test file and push branch with exit code $rc"; log "=== git status --short ==="; git status --short >> "$LOG_FILE" 2>&1 || true; exit $rc' ERR

          log ""
          log "=== Create test file and push branch ==="

          mkdir -p output_paths/push_test

          TEST_FILE="output_paths/push_test/branch_push_test.txt"

          {
            echo "repo=${{ github.repository }}"
            echo "branch=$TARGET_BRANCH"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=$(hostname)"
          } > "$TEST_FILE"

          log "Created test file: $TEST_FILE"

          git add "$TEST_FILE" >> "$LOG_FILE" 2>&1

          log "=== git status --short after add ==="
          git status --short >> "$LOG_FILE" 2>&1

          if git diff --cached --quiet; then
            log "No changes to commit"
            exit 0
          fi

          log "=== git commit ==="
          git commit -m "Test basic push to branch" >> "$LOG_FILE" 2>&1

          log "=== git remote set-url ==="
          git remote set-url origin "$REPO_URL" >> "$LOG_FILE" 2>&1
          git remote -v >> "$LOG_FILE" 2>&1

          log "=== git push to target branch ==="
          git push -u origin "$TARGET_BRANCH" >> "$LOG_FILE" 2>&1

          log "Push completed successfully"

      - name: Final marker
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow finished. Check log file at: ${{ env.DEBUG_LOG_PATH }}"
