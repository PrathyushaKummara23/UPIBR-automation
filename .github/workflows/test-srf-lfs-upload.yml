name: Test Push Auth with PAT

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-push:
    runs-on: [self-hosted, Linux, X64, gnr_r1s-prod-runner]
    timeout-minutes: 15

    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GH_PAT_PUSH }}

    steps:
      - name: Verify PAT provided
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN}" ] || { echo "Missing PAT secret GH_PAT_PUSH"; exit 1; }

      - name: Resolve default branch
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}" | jq -r '.default_branch')"

          test -n "${DEFAULT_BRANCH}" && [ "${DEFAULT_BRANCH}" != "null" ] || { echo "Could not resolve default branch"; exit 1; }
          TEST_BRANCH="pat-auth-test-$(date +%s)"

          echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}" >> "${GITHUB_ENV}"
          echo "TEST_BRANCH=${TEST_BRANCH}" >> "${GITHUB_ENV}"

      - name: Clone
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/push-auth-test-pat"
          rm -rf "${WORK}"
          git clone --branch "${DEFAULT_BRANCH}" "https://github.com/${GH_REPO}.git" "${WORK}"
          cd "${WORK}"
          git checkout -B "${TEST_BRANCH}"
          echo "WORK_REPO=${WORK}" >> "${GITHUB_ENV}"

      - name: Commit test change
        shell: bash
        run: |
          set -euo pipefail
          cd "${WORK_REPO}"
          mkdir -p .github/push-auth-test
          cat > .github/push-auth-test/pat-test-$(date +%s).txt <<EOF
          PAT push test
          repo=${GH_REPO}
          actor=${GITHUB_ACTOR}
          run_id=${GITHUB_RUN_ID}
          time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/push-auth-test
          git commit -m "Test PAT push from self-hosted runner"

      - name: Push using PAT
        shell: bash
        run: |
          set -euo pipefail
          cd "${WORK_REPO}"
          git remote set-url origin "https://github.com/${GH_REPO}.git"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')" \
            push -u origin "${TEST_BRANCH}"

      - name: Done
        shell: bash
        run: |
          set -euo pipefail
          echo "SUCCESS: https://github.com/${GH_REPO}/tree/${TEST_BRANCH}"
