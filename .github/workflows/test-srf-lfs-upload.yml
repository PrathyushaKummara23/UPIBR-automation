name: Proxy Unset Syntax Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, gnr_r1s-prod-runner]
    steps:
      - name: Network mode for GitHub
        shell: bash
        run: |
          set -euo pipefail
          unset http_proxy
          unset HTTP_PROXY
          unset https_proxy
          unset HTTPS_PROXY
          export no_proxy="github.com,api.github.com"
          export NO_PROXY="github.com,api.github.com"
          git config --global --unset-all http.proxy || true
          git config --global --unset-all https.proxy || true
          echo "Proxy unset for GitHub operations"
