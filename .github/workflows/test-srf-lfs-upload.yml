name: SRF Collateral Commit to Repo (Linux)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (example: 830003C4)"
        required: true
        type: string
      src_release_dir:
        description: "Source release directory base"
        required: true
        default: "/nfs/site/disks/dcsg_0729/patches/SRF/C0/build"
        type: string
      inc_basename:
        description: "Base file name without extension (example: m_01_a06f3_830003c4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  commit-collaterals:
    runs-on: [self-hosted, Linux, X64, gnr_r1s-prod-runner]
    timeout-minutes: 30

    env:
      BUILD_ID: ${{ inputs.build_id }}
      ROOT_RELEASE_BASE: ${{ inputs.src_release_dir }}
      INC_BASENAME: ${{ inputs.inc_basename }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Prepare zipped SRF files
        shell: bash
        run: |
          set -euo pipefail

          SRC_RELEASE_DIR="${ROOT_RELEASE_BASE}/${BUILD_ID}/release"
          INC_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.pdb"
          WORK_DIR="${RUNNER_TEMP}/srf-release-collaterals/${BUILD_ID}"

          test -d "${SRC_RELEASE_DIR}" || { echo "Missing source directory: ${SRC_RELEASE_DIR}"; exit 1; }
          test -f "${INC_FILE}" || { echo "Missing INC file: ${INC_FILE}"; exit 1; }
          test -f "${PDB_FILE}" || { echo "Missing PDB file: ${PDB_FILE}"; exit 1; }

          mkdir -p "${WORK_DIR}"

          INC_ZIP="${WORK_DIR}/$(basename "${INC_FILE}").zip"
          PDB_ZIP="${WORK_DIR}/$(basename "${PDB_FILE}").zip"

          zip -j "${INC_ZIP}" "${INC_FILE}"
          zip -j "${PDB_ZIP}" "${PDB_FILE}"

          echo "INC_ZIP=${INC_ZIP}" >> "${GITHUB_ENV}"
          echo "PDB_ZIP=${PDB_ZIP}" >> "${GITHUB_ENV}"

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v jq >/dev/null
          command -v python3 >/dev/null

      - name: Commit zip files to repository via GitHub API
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${GH_REPO}"
          DEST_DIR="release-collaterals/${BUILD_ID}"

          upload_file () {
            local src_file="$1"
            local file_name path probe_code sha payload_file put_code

            file_name="$(basename "${src_file}")"
            path="${DEST_DIR}/${file_name}"
            payload_file="${RUNNER_TEMP}/payload-${file_name}.json"

            # status-only probe (no body file => avoids curl 18 partial-file issues)
            probe_code="$(curl -sS -L --retry 5 --retry-all-errors --connect-timeout 20 \
              -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/contents/${path}")"

            if [ "${probe_code}" = "200" ]; then
              sha="$(curl -sS -L --retry 5 --retry-all-errors --connect-timeout 20 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${API}/contents/${path}" | jq -r '.sha')"
            elif [ "${probe_code}" = "404" ]; then
              sha=""
            else
              echo "Failed checking existing file ${path}, HTTP ${probe_code}"
              exit 1
            fi

            SRC_FILE="${src_file}" SHA_VAL="${sha}" BUILD_VAL="${BUILD_ID}" FILE_VAL="${file_name}" \
            python3 - <<'PY' > "${payload_file}"
import os, json, base64
src = os.environ["SRC_FILE"]
sha = os.environ.get("SHA_VAL","")
build = os.environ["BUILD_VAL"]
name = os.environ["FILE_VAL"]
with open(src, "rb") as f:
    b64 = base64.b64encode(f.read()).decode("ascii")
payload = {
    "message": f"Add SRF collateral {name} for build {build}",
    "content": b64
}
if sha:
    payload["sha"] = sha
print(json.dumps(payload))
PY

            put_code="$(curl -sS -L --retry 5 --retry-all-errors --connect-timeout 20 \
              -o "${RUNNER_TEMP}/put_result-${file_name}.json" -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "${API}/contents/${path}" \
              --data-binary @"${payload_file}")"

            if [ "${put_code}" != "200" ] && [ "${put_code}" != "201" ]; then
              echo "Upload failed for ${path}, HTTP ${put_code}"
              cat "${RUNNER_TEMP}/put_result-${file_name}.json"
              exit 1
            fi

            echo "Committed: ${path}"
          }

          upload_file "${INC_ZIP}"
          upload_file "${PDB_ZIP}"

      - name: Print committed path
        shell: bash
        run: |
          echo "https://github.com/${GH_REPO}/tree/${GITHUB_REF_NAME}/release-collaterals/${BUILD_ID}"
