name: SRF Artifact Upload

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (example: 836003C4)"
        required: true
        type: string
      src_release_dir:
        description: "Source release directory base"
        required: true
        default: "/nfs/site/disks/dcsg_0729/patches/SRF/C0/build"
        type: string
      inc_basename:
        description: "Base file name without extension (example: m_01_a06f3_836003c4)"
        required: true
        type: string

jobs:
  srf-artifact-upload:
    name: Prepare and upload SRF zip artifacts
    runs-on: [self-hosted, Linux, X64, gnr_r1s-prod-runner]
    timeout-minutes: 30

    env:
      BUILD_ID: ${{ inputs.build_id }}
      ROOT_RELEASE_BASE: ${{ inputs.src_release_dir }}
      INC_BASENAME: ${{ inputs.inc_basename }}

    steps:
      # checkout/upload-artifact may fail on old glibc+Node24 runners.
      # Keep checkout only if you really need repo files.
      - name: Optional checkout
        if: ${{ false }}
        uses: actions/checkout@v4

      - name: Prepare zipped SRF files
        shell: bash
        run: |
          set -euo pipefail

          SRC_RELEASE_DIR="${ROOT_RELEASE_BASE}/${BUILD_ID}/release"
          INC_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/${INC_BASENAME}.pdb"
          ARTIFACT_DIR="${RUNNER_TEMP}/srf-release-collaterals/${BUILD_ID}"

          echo "SRC_RELEASE_DIR=${SRC_RELEASE_DIR}"
          echo "INC_FILE=${INC_FILE}"
          echo "PDB_FILE=${PDB_FILE}"
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}"

          test -d "${SRC_RELEASE_DIR}" || { echo "ERROR: Source directory missing: ${SRC_RELEASE_DIR}"; exit 1; }
          test -f "${INC_FILE}" || { echo "ERROR: INC file missing: ${INC_FILE}"; exit 1; }
          test -f "${PDB_FILE}" || { echo "ERROR: PDB file missing: ${PDB_FILE}"; exit 1; }

          mkdir -p "${ARTIFACT_DIR}"

          INC_ZIP="${ARTIFACT_DIR}/$(basename "${INC_FILE}").zip"
          PDB_ZIP="${ARTIFACT_DIR}/$(basename "${PDB_FILE}").zip"

          zip -j "${INC_ZIP}" "${INC_FILE}"
          zip -j "${PDB_ZIP}" "${PDB_FILE}"

          test -f "${INC_ZIP}" || { echo "ERROR: INC zip not created: ${INC_ZIP}"; exit 1; }
          test -f "${PDB_ZIP}" || { echo "ERROR: PDB zip not created: ${PDB_ZIP}"; exit 1; }

          ls -lah "${ARTIFACT_DIR}"

          echo "ARTIFACT_DIR=${ARTIFACT_DIR}" >> "${GITHUB_ENV}"
          echo "INC_ZIP=${INC_ZIP}" >> "${GITHUB_ENV}"
          echo "PDB_ZIP=${PDB_ZIP}" >> "${GITHUB_ENV}"

      - name: Verify zipped outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}"
          echo "INC_ZIP=${INC_ZIP}"
          echo "PDB_ZIP=${PDB_ZIP}"
          test -d "${ARTIFACT_DIR}"
          test -f "${INC_ZIP}"
          test -f "${PDB_ZIP}"
          ls -lah "${ARTIFACT_DIR}"

      # If your runner supports Node24/glibc, enable this:
      - name: Upload SRF zip artifacts
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: srf-release-${{ env.BUILD_ID }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.INC_ZIP }}
            ${{ env.PDB_ZIP }}

      # Fallback: always works without Node-based upload-artifact
      - name: Stage artifacts for external pickup
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="/nfs/site/disks/dcsg_0729/users/${USER}/github-artifacts/${BUILD_ID}"
          mkdir -p "${OUT_DIR}"
          cp -f "${INC_ZIP}" "${OUT_DIR}/"
          cp -f "${PDB_ZIP}" "${OUT_DIR}/"
          echo "Artifacts staged at: ${OUT_DIR}"
          ls -lah "${OUT_DIR}"
