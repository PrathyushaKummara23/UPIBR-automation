name: SRF Artifact Upload

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (example: 836003C4)"
        required: true
        type: string
      src_release_dir:
        description: "Source release directory"
        required: true
        default: "C:\\SRF\\C0\\build"
        type: string
      inc_basename:
        description: "Base file name without extension (example: m_01_a06f3_836003c4)"
        required: true
        type: string

jobs:
  srf-artifact-upload:
    name: Prepare and upload SRF zip artifacts
    runs-on: [self-hosted, X64, Windows, gnr_r1s-prod-fit1]
    timeout-minutes: 30

    env:
      BUILD_ID: ${{ inputs.build_id }}
      ROOT_RELEASE_BASE: ${{ inputs.src_release_dir }}
      INC_BASENAME: ${{ inputs.inc_basename }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare zipped SRF files
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $srcReleaseDir = Join-Path $env:ROOT_RELEASE_BASE "$($env:BUILD_ID)\release"
          $incFile = Join-Path $srcReleaseDir "$($env:INC_BASENAME).inc"
          $pdbFile = Join-Path $srcReleaseDir "$($env:INC_BASENAME).pdb"
          $artifactDir = Join-Path $env:RUNNER_TEMP "srf-release-collaterals\$($env:BUILD_ID)"

          Write-Host "SRC_RELEASE_DIR=$srcReleaseDir"
          Write-Host "INC_FILE=$incFile"
          Write-Host "PDB_FILE=$pdbFile"
          Write-Host "ARTIFACT_DIR=$artifactDir"

          if (!(Test-Path $srcReleaseDir)) { throw "Source directory missing: $srcReleaseDir" }
          if (!(Test-Path $incFile)) { throw "INC file missing: $incFile" }
          if (!(Test-Path $pdbFile)) { throw "PDB file missing: $pdbFile" }

          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $incZip = Join-Path $artifactDir "$($env:INC_BASENAME).inc.zip"
          $pdbZip = Join-Path $artifactDir "$($env:INC_BASENAME).pdb.zip"

          Compress-Archive -Path $incFile -DestinationPath $incZip -Force
          Compress-Archive -Path $pdbFile -DestinationPath $pdbZip -Force

          if (!(Test-Path $incZip)) { throw "INC zip not created: $incZip" }
          if (!(Test-Path $pdbZip)) { throw "PDB zip not created: $pdbZip" }

          Get-ChildItem $artifactDir | Format-Table Name,Length,LastWriteTime -AutoSize

          "ARTIFACT_DIR=$artifactDir" >> $env:GITHUB_ENV
          "INC_ZIP=$incZip" >> $env:GITHUB_ENV
          "PDB_ZIP=$pdbZip" >> $env:GITHUB_ENV

      - name: Verify zipped outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "ARTIFACT_DIR=$env:ARTIFACT_DIR"
          Write-Host "INC_ZIP=$env:INC_ZIP"
          Write-Host "PDB_ZIP=$env:PDB_ZIP"

          if (!(Test-Path $env:ARTIFACT_DIR)) { throw "Missing artifact directory: $env:ARTIFACT_DIR" }
          if (!(Test-Path $env:INC_ZIP)) { throw "Missing file: $env:INC_ZIP" }
          if (!(Test-Path $env:PDB_ZIP)) { throw "Missing file: $env:PDB_ZIP" }

      - name: Upload SRF zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: srf-release-${{ env.BUILD_ID }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.INC_ZIP }}
            ${{ env.PDB_ZIP }}
