name: Test SRF Artifact Upload

on:
  workflow_dispatch:

env:
  DEBUG_LOG_PATH: /nfs/site/disks/dcsg_0729/users/pkummara/test-srf-artifact-upload.log

jobs:
  test-artifact-upload:
    runs-on: [self-hosted, node16]

    steps:
      - name: Prepare zipped SRF files
        shell: bash
        run: |
          set -euo pipefail

          LOG_FILE="${{ env.DEBUG_LOG_PATH }}"
          mkdir -p "$(dirname "$LOG_FILE")"
          : > "$LOG_FILE"

          log() {
            echo "$1" | tee -a "$LOG_FILE"
          }

          trap 'rc=$?; log ""; log "FAILED in Prepare zipped SRF files with exit code $rc"; exit $rc' ERR

          log "=== Prepare zipped SRF files ==="

          CURRENT_VERSION="836003C4"
          CURRENT_VERSION_LOWER="$(echo "$CURRENT_VERSION" | tr '[:upper:]' '[:lower:]')"
          SRC_RELEASE_DIR="/nfs/site/disks/dcsg_0729/patches/SRF/C0/build/${CURRENT_VERSION}/release"

          INC_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc"
          PDB_FILE="${SRC_RELEASE_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb"

          ARTIFACT_DIR="/tmp/srf-release-collaterals/${CURRENT_VERSION}"
          INC_ZIP="${ARTIFACT_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.inc.zip"
          PDB_ZIP="${ARTIFACT_DIR}/m_01_a06f3_${CURRENT_VERSION_LOWER}.pdb.zip"

          log "SRC_RELEASE_DIR=$SRC_RELEASE_DIR"
          log "INC_FILE=$INC_FILE"
          log "PDB_FILE=$PDB_FILE"
          log "ARTIFACT_DIR=$ARTIFACT_DIR"

          [ -d "$SRC_RELEASE_DIR" ] || { log "Release directory missing"; exit 1; }
          [ -f "$INC_FILE" ] || { log "INC file missing"; exit 1; }
          [ -f "$PDB_FILE" ] || { log "PDB file missing"; exit 1; }

          mkdir -p "$ARTIFACT_DIR"
          rm -f "$INC_ZIP" "$PDB_ZIP"

          log "=== Source file sizes ==="
          ls -lh "$INC_FILE" >> "$LOG_FILE" 2>&1
          ls -lh "$PDB_FILE" >> "$LOG_FILE" 2>&1

          log "=== Create zip files ==="
          zip -j "$INC_ZIP" "$INC_FILE" >> "$LOG_FILE" 2>&1
          zip -j "$PDB_ZIP" "$PDB_FILE" >> "$LOG_FILE" 2>&1

          [ -f "$INC_ZIP" ] || { log "INC zip not created"; exit 1; }
          [ -f "$PDB_ZIP" ] || { log "PDB zip not created"; exit 1; }

          log "=== Zip sizes ==="
          ls -lh "$INC_ZIP" >> "$LOG_FILE" 2>&1
          ls -lh "$PDB_ZIP" >> "$LOG_FILE" 2>&1

          log "Zipped files prepared successfully"

      - name: Upload zipped files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: srf-release-collaterals-836003C4
          path: /tmp/srf-release-collaterals/836003C4/
          if-no-files-found: error
          retention-days: 30

      - name: Final marker
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow finished. Check local debug log at: ${{ env.DEBUG_LOG_PATH }}"
