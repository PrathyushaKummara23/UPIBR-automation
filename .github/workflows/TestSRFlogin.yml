name: SRF SSH Login - Test

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
    secrets:
      SRF_PASSWORD:
        required: true

jobs:
  srf-login:
    name: SRF SSH Login
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Session Info Display
        if: ${{ inputs.session_id != '' }}
        shell: bash
        run: |
          echo "Session ID: ${{ inputs.session_id }}"
          echo "Triggered by: ${{ inputs.trigger_source }}"
          echo "Callback URL: ${{ inputs.callback_url }}"

      - name: SSH into Windows host and run deploy_reboot_wrapper.py
        env:
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "  SRF SSH Login - Post Build Auto Login"
          echo "================================================="

          # Write expect script to a temp file with NO indentation
          # (indentation inside heredoc gets written literally into the .exp file
          #  and breaks Tcl parsing)
          cat > /tmp/ssh_login_${{ github.run_id }}.exp << 'ENDOFSCRIPT'
#!/usr/bin/expect -f

# SSH into a Windows host from a Linux runner.
# The Windows SSH server (OpenSSH for Windows) opens a CMD shell whose
# prompt looks like:
#   cefls_user@ELFLEET045 C:\Users\CEFLS_User>
# We match on the literal ">" which always terminates a CMD prompt.

set timeout 120
set password $env(SRF_PASSWORD)

# Suppress noisy ANSI/VT sequences sent by the Windows conhost terminal
log_user 0

# Match Windows CMD prompt - just look for ">" which always ends the prompt.
# Keeping it simple avoids Tcl regex anchor issues with \r\n line endings.
set prompt_re {>}

spawn ssh -tt \
  -o StrictHostKeyChecking=no \
  -o UserKnownHostsFile=/dev/null \
  -o RequestTTY=yes \
  CEFLS_User@10.138.186.198

expect {
  -re {(?i)are you sure you want to continue connecting} { send "yes\r"; exp_continue }
  -re {(?i)password:}                                   { send "$password\r"; exp_continue }
  -re {(?i)permission denied}                           { puts "FAILURE: Invalid credentials"; exit 1 }
  -re {(?i)connection timed out|no route to host|connection refused} {
    puts "FAILURE: SSH network/connectivity issue"; exit 1
  }
  -re $prompt_re {}
  eof     { puts "FAILURE: SSH session closed before prompt"; exit 1 }
  timeout { puts "FAILURE: Timed out waiting for SSH login"; exit 1 }
}

log_user 1
puts "SUCCESS: Logged in to Windows host"
log_user 0

# Run whoami to confirm login identity
send "whoami\r"
expect {
  -re $prompt_re {}
  eof     { puts "FAILURE: SSH session closed after whoami"; exit 1 }
  timeout { puts "FAILURE: whoami timed out"; exit 1 }
}

# Change to the scripts directory (Windows path)
send "cd C:\\Users\\pkummara\\scripts\r"
expect {
  -re $prompt_re {}
  eof     { puts "FAILURE: SSH session closed after cd"; exit 1 }
  timeout { puts "FAILURE: cd timed out"; exit 1 }
}

# Confirm directory contents
send "dir\r"
expect {
  -re $prompt_re {}
  eof     { puts "FAILURE: SSH session closed after dir"; exit 1 }
  timeout { puts "FAILURE: dir timed out"; exit 1 }
}

# Run the Python wrapper - give it up to 5 minutes
set timeout 300
send "C:\\Python310\\python.exe -u .\\deploy_reboot_wrapper.py\r"
expect {
  -re $prompt_re {}
  eof     { puts "FAILURE: SSH session closed during Python execution"; exit 1 }
  timeout { puts "FAILURE: Python script did not complete in time"; exit 1 }
}

send "exit\r"
expect eof
ENDOFSCRIPT

          chmod +x /tmp/ssh_login_${{ github.run_id }}.exp

          echo "Connecting to Windows host via SSH..."
          /usr/bin/expect /tmp/ssh_login_${{ github.run_id }}.exp
          SSH_EXIT=$?
          rm -f /tmp/ssh_login_${{ github.run_id }}.exp

          if [ $SSH_EXIT -eq 0 ]; then
            echo "SUCCESS: SSH login and command executed successfully"
          else
            echo "FAILURE: SSH connection failed with exit code: $SSH_EXIT"
            exit $SSH_EXIT
          fi

      - name: Send SRF Login Notification
        if: ${{ inputs.callback_url != '' }}
        shell: bash
        run: |
          echo "Sending SRF login notification..."

          CALLBACK_URL="${{ inputs.callback_url }}"
          SESSION_ID="${{ inputs.session_id }}"

          if [ -n "$CALLBACK_URL" ]; then
            PAYLOAD=$(printf '{"session_id":"%s","status":"srf_login_completed","message":"SRF login process completed","workflow_run_id":"%s","timestamp":"%s","trigger_source":"%s","srf_login_deployed_at":"%s"}' \
              "$SESSION_ID" \
              "${{ github.run_id }}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${{ inputs.trigger_source }}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            curl --noproxy 127.0.0.1 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "Failed to send SRF login notification"
          else
            echo "No callback URL provided, skipping notification"
          fi
