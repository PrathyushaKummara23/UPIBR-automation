name: SRF SSH Login - Test

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
      srf_host:
        description: 'SRF host IP or hostname'
        required: false
        type: string
        default: '10.138.186.198'
      srf_user:
        description: 'SRF SSH user'
        required: false
        type: string
        default: 'CEFLS_User'
      target_ip:
        description: 'Target host IP'
        required: false
        type: string
        default: '10.138.186.208'
      target_user:
        description: 'Target SSH user'
        required: false
        type: string
        default: 'root'
      bmc_ip:
        description: 'BMC IP'
        required: false
        type: string
        default: '10.138.186.218'
      bmc_user:
        description: 'BMC user'
        required: false
        type: string
        default: 'root'
      apc_ip:
        description: 'APC IP'
        required: false
        type: string
        default: '10.138.186.171'
      apc_user:
        description: 'APC user'
        required: false
        type: string
        default: 'apc'
      apc_outlet:
        description: 'APC outlet number'
        required: false
        type: string
        default: '3'
      putty_path:
        description: 'Putty exe path'
        required: false
        type: string
        default: 'C:\Program Files\PuTTY\putty.exe'
      putty_com_port:
        description: 'Putty COM port'
        required: false
        type: string
        default: 'COM3'
      putty_baud_rate:
        description: 'Putty baud rate'
        required: false
        type: string
        default: '115200'
  workflow_call:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
      srf_host:
        description: 'SRF host IP or hostname'
        required: false
        type: string
        default: '10.138.186.198'
      srf_user:
        description: 'SRF SSH user'
        required: false
        type: string
        default: 'CEFLS_User'
      target_ip:
        description: 'Target host IP'
        required: false
        type: string
        default: '10.138.186.208'
      target_user:
        description: 'Target SSH user'
        required: false
        type: string
        default: 'root'
      bmc_ip:
        description: 'BMC IP'
        required: false
        type: string
        default: '10.138.186.218'
      bmc_user:
        description: 'BMC user'
        required: false
        type: string
        default: 'root'
      apc_ip:
        description: 'APC IP'
        required: false
        type: string
        default: '10.138.186.171'
      apc_user:
        description: 'APC user'
        required: false
        type: string
        default: 'apc'
      apc_outlet:
        description: 'APC outlet number'
        required: false
        type: string
        default: '3'
      putty_path:
        description: 'Putty exe path'
        required: false
        type: string
        default: 'C:\Program Files\PuTTY\putty.exe'
      putty_com_port:
        description: 'Putty COM port'
        required: false
        type: string
        default: 'COM3'
      putty_baud_rate:
        description: 'Putty baud rate'
        required: false
        type: string
        default: '115200'
    secrets:
      SRF_PASSWORD:
        required: true
      TARGET_PASSWORD:
        required: true
      BMC_PASSWORD:
        required: true
      APC_PASSWORD:
        required: true

jobs:
  srf-login:
    name: SRF SSH Login
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Session Info Display
        if: ${{ inputs.session_id != '' }}
        shell: bash
        run: |
          echo "Session ID: ${{ inputs.session_id }}"
          echo "Triggered by: ${{ inputs.trigger_source }}"
          echo "Callback URL: ${{ inputs.callback_url }}"

      - name: SSH into SRF host and run deploy_reboot_wrapper.py
        env:
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
          TARGET_PASSWORD: ${{ secrets.TARGET_PASSWORD }}
          BMC_PASSWORD: ${{ secrets.BMC_PASSWORD }}
          APC_PASSWORD: ${{ secrets.APC_PASSWORD }}
          SRF_HOST: ${{ inputs.srf_host }}
          SRF_USER: ${{ inputs.srf_user }}
          TARGET_IP: ${{ inputs.target_ip }}
          TARGET_USER: ${{ inputs.target_user }}
          BMC_IP: ${{ inputs.bmc_ip }}
          BMC_USER: ${{ inputs.bmc_user }}
          APC_IP: ${{ inputs.apc_ip }}
          APC_USER: ${{ inputs.apc_user }}
          APC_OUTLET: ${{ inputs.apc_outlet }}
          PUTTY_PATH: ${{ inputs.putty_path }}
          PUTTY_COM_PORT: ${{ inputs.putty_com_port }}
          PUTTY_BAUD_RATE: ${{ inputs.putty_baud_rate }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "  SRF SSH Login - Post Build Auto Login"
          echo "================================================="

          for var_name in SRF_PASSWORD TARGET_PASSWORD BMC_PASSWORD APC_PASSWORD; do
            if [ -z "${!var_name:-}" ]; then
              echo "FAILURE: $var_name is not set in environment"
              exit 1
            fi
          done

          cat > /tmp/ssh_login_${{ github.run_id }}.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 3000
          set password $env(SRF_PASSWORD)
          set target_password $env(TARGET_PASSWORD)
          set target_user $env(TARGET_USER)
          set bmc_password $env(BMC_PASSWORD)
          set apc_password $env(APC_PASSWORD)
          set tgt_ip $env(TARGET_IP)
          set bmc_ip $env(BMC_IP)
          set bmc_user $env(BMC_USER)
          set apc_ip $env(APC_IP)
          set apc_user $env(APC_USER)
          set apc_outlet $env(APC_OUTLET)
          set putty_path $env(PUTTY_PATH)
          set putty_com_port $env(PUTTY_COM_PORT)
          set putty_baud_rate $env(PUTTY_BAUD_RATE)
          set srf_user $env(SRF_USER)

          set config_path "C:\\pkummara\\apis\\automation_config.ini"
          set script_path "C:\\pkummara\\scripts\\deploy_reboot_wrapper.py"

          spawn ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardX11=no $env(SRF_USER)@$env(SRF_HOST)

          expect {
            "*assword:*" { send "$password\r" }
            "Permission denied" { puts "FAILURE: Invalid SSH credentials"; exit 1 }
            "Connection refused" { puts "FAILURE: SSH connection refused"; exit 1 }
            "Could not resolve hostname" { puts "FAILURE: Hostname resolution failed"; exit 1 }
            "No route to host" { puts "FAILURE: No route to host"; exit 1 }
            timeout { puts "FAILURE: Connection timed out"; exit 1 }
            eof { puts "FAILURE: SSH session terminated before password prompt"; exit 1 }
          }

          expect {
            "Permission denied" { puts "FAILURE: Invalid SSH credentials"; exit 1 }
            "*assword:*" { puts "FAILURE: Password rejected"; exit 1 }
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: Shell prompt not received"; exit 1 }
            eof { puts "FAILURE: SSH session closed after login"; exit 1 }
          }

          send "whoami\r"
          expect {
            -re {.*(>|#|\$|PS ).*} {
              set whoami_output $expect_out(buffer)
              if {![string match -nocase "*$srf_user*" $whoami_output]} {
                puts "FAILURE: whoami did not return expected user"
                puts "WHOAMI OUTPUT: $whoami_output"
                exit 1
              }
            }
            timeout { puts "FAILURE: whoami did not complete"; exit 1 }
            eof { puts "FAILURE: SSH session closed after whoami"; exit 1 }
          }

          send "if exist \"$script_path\" (echo SCRIPT_FOUND) else (echo SCRIPT_MISSING)\r"
          expect {
            "SCRIPT_FOUND" {}
            "SCRIPT_MISSING" { puts "FAILURE: deploy_reboot_wrapper.py not found at expected path"; exit 1 }
            timeout { puts "FAILURE: Script existence check timed out"; exit 1 }
            eof { puts "FAILURE: SSH session closed during script existence check"; exit 1 }
          }

          expect {
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: Prompt not received after script existence check"; exit 1 }
            eof { puts "FAILURE: SSH session closed after script existence check"; exit 1 }
          }

          # create/update automation_config.ini on the remote host so imported
          # `apis.automation_config` will see TARGET/BMC/APC credentials at import time.
          # Backup existing file if present. Suppress logging while writing secrets.
          log_user 0
          send "if exist \"$config_path\" ren \"$config_path\" automation_config.ini.bak\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo \[NETWORK\] > \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo TARGET_IP=$tgt_ip >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo TARGET_USER=$target_user >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo TARGET_PASSWORD=$target_password >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo BMC_IP=$bmc_ip >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo BMC_USER=$bmc_user >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo BMC_PASSWORD=$bmc_password >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo. >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo \[APC\] >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo APC_IP=$apc_ip >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo APC_USER=$apc_user >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo APC_PASSWORD=$apc_password >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo APC_OUTLET=$apc_outlet >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo. >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo \[PUTTY\] >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo PUTTY_PATH=$putty_path >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo PUTTY_COM_PORT=$putty_com_port >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          send "echo PUTTY_BAUD_RATE=$putty_baud_rate >> \"$config_path\"\r"
          expect -re {.*(>|#|\$|PS ).*}
          log_user 1

          send "cd C:\\pkummara\\scripts\r"
          expect {
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: cd to scripts directory did not complete"; exit 1 }
            eof { puts "FAILURE: SSH session closed while changing directory"; exit 1 }
          }

          send "py -3 -u .\\deploy_reboot_wrapper.py\r"
          expect {
            -re {.*(>|#|\$|PS ).*} {
              set py_output $expect_out(buffer)
            }
            timeout {
              puts "FAILURE: Python script did not complete"
              exit 1
            }
            eof {
              puts "FAILURE: SSH session closed while waiting for Python script completion"
              exit 1
            }
          }

          if {[string match -nocase "*Traceback (most recent call last)*" $py_output]} {
            puts "FAILURE: Python script threw an exception"
            puts $py_output
            exit 1
          }

          if {[string match -nocase "*can't open file*" $py_output]} {
            puts "FAILURE: Python could not open deploy_reboot_wrapper.py"
            puts $py_output
            exit 1
          }

          send "echo __PY_EXIT_CODE__=%ERRORLEVEL%\r"
          expect {
            -re {__PY_EXIT_CODE__=([0-9]+)} {
              set py_exit $expect_out(1,string)
              if {$py_exit ne "0"} {
                puts "FAILURE: Remote Python exited with code $py_exit"
                puts $py_output
                exit 1
              }
            }
            timeout {
              puts "FAILURE: Could not determine remote Python exit code"
              puts $py_output
              exit 1
            }
            eof {
              puts "FAILURE: SSH session closed while reading Python exit code"
              puts $py_output
              exit 1
            }
          }

          expect {
            -re {.*(>|#|\$|PS ).*} {}
            timeout { puts "FAILURE: Prompt not received after exit code check"; exit 1 }
            eof { puts "FAILURE: SSH session closed after exit code check"; exit 1 }
          }

          send "exit\r"
          expect eof
          EOF

          chmod +x /tmp/ssh_login_${{ github.run_id }}.exp
          echo "Connecting to SRF host via SSH..."

          set +e
          /usr/bin/expect /tmp/ssh_login_${{ github.run_id }}.exp
          SSH_EXIT=$?
          set -e

          rm -f /tmp/ssh_login_${{ github.run_id }}.exp

          if [ $SSH_EXIT -eq 0 ]; then
            echo "SUCCESS: SSH login and command executed successfully"
          else
            echo "FAILURE: SSH connection failed with exit code: $SSH_EXIT"
            exit $SSH_EXIT
          fi

      - name: Send SRF Login Notification
        if: ${{ inputs.callback_url != '' }}
        env:
          SRF_HOST: ${{ inputs.srf_host }}
          SRF_USER: ${{ inputs.srf_user }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Sending SRF login notification..."

          CALLBACK_URL="${{ inputs.callback_url }}"
          SESSION_ID="${{ inputs.session_id }}"

          if [ -n "$CALLBACK_URL" ]; then
            PAYLOAD=$(printf '{"session_id":"%s","status":"srf_login_completed","message":"SRF login process completed","workflow_run_id":"%s","timestamp":"%s","trigger_source":"%s","srf_login_details":{"host":"%s","user":"%s","login_timestamp":"%s"}}' \
              "$SESSION_ID" \
              "${{ github.run_id }}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${{ inputs.trigger_source }}" \
              "$SRF_HOST" \
              "$SRF_USER" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)")

            curl --noproxy 127.0.0.1 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "Failed to send SRF login notification"
          else
            echo "No callback URL provided, skipping notification"
          fi
