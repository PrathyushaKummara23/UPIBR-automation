name: SRF SSH Login - Test

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
      srf_host:
        description: 'SRF host IP or hostname'
        required: false
        type: string
        default: '10.138.186.198'
      srf_user:
        description: 'SRF SSH user'
        required: false
        type: string
        default: 'CEFLS_User'
      target_ip:
        description: 'Target host IP'
        required: false
        type: string
        default: '10.138.186.79'
      target_user:
        description: 'Target SSH user'
        required: false
        type: string
        default: 'root'
      bmc_ip:
        description: 'BMC IP'
        required: false
        type: string
        default: '10.138.186.218'
      bmc_user:
        description: 'BMC user'
        required: false
        type: string
        default: 'debuguser'
      apc_ip:
        description: 'APC IP'
        required: false
        type: string
        default: '10.138.186.171'
      apc_user:
        description: 'APC user'
        required: false
        type: string
        default: 'apc'
      apc_outlet:
        description: 'APC outlet number'
        required: false
        type: string
        default: '3'
      putty_path:
        description: 'Putty exe path'
        required: false
        type: string
        default: 'C:\\Program Files\\PuTTY\\putty.exe'
  workflow_call:
    inputs:
      session_id:
        description: 'Session ID for tracking'
        required: false
        type: string
        default: ''
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        type: string
        default: 'unknown'
      callback_url:
        description: 'Callback URL for notifications'
        required: false
        type: string
        default: ''
      srf_host:
        description: 'SRF host IP or hostname'
        required: false
        type: string
        default: '10.138.186.198'
      srf_user:
        description: 'SRF SSH user'
        required: false
        type: string
        default: 'CEFLS_User'
      target_ip:
        description: 'Target host IP'
        required: false
        type: string
        default: '10.138.186.79'
      target_user:
        description: 'Target SSH user'
        required: false
        type: string
        default: 'root'
      bmc_ip:
        description: 'BMC IP'
        required: false
        type: string
        default: '10.138.186.218'
      bmc_user:
        description: 'BMC user'
        required: false
        type: string
        default: 'debuguser'
      apc_ip:
        description: 'APC IP'
        required: false
        type: string
        default: '10.138.186.171'
      apc_user:
        description: 'APC user'
        required: false
        type: string
        default: 'apc'
      apc_outlet:
        description: 'APC outlet number'
        required: false
        type: string
        default: '3'
      putty_path:
        description: 'Putty exe path'
        required: false
        type: string
        default: 'C:\\Program Files\\PuTTY\\putty.exe'
    secrets:
      SRF_PASSWORD:
        required: true
      TARGET_PASSWORD:
        required: true
      BMC_PASSWORD:
        required: true
      APC_PASSWORD:
        required: true

jobs:
  srf-login:
    name: SRF SSH Login
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Session Info Display
        if: ${{ inputs.session_id != '' }}
        shell: bash
        run: |
          echo "Session ID: ${{ inputs.session_id }}"
          echo "Triggered by: ${{ inputs.trigger_source }}"
          echo "Callback URL: ${{ inputs.callback_url }}"

      - name: Secret presence check (masked length)
        env:
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
        shell: bash
        run: |
          # print only the length of the secret (not the value)
          if [ -z "$SRF_PASSWORD" ]; then
            echo "SRF_PASSWORD is not set"
            exit 1
          fi
          echo "SRF_PASSWORD length: ${#SRF_PASSWORD}"

      - name: Auth check (validate SSH + password)
        env:
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
          SRF_HOST: ${{ inputs.srf_host }}
          SRF_USER: ${{ inputs.srf_user }}
        shell: bash
        run: |
          set -e
          echo "Auth-check: validating SSH connectivity to $SRF_USER@$SRF_HOST"
          cat > /tmp/auth_check_${{ github.run_id }}.exp << 'EOF'
          #!/usr/bin/expect -f
          # enable verbose debugging for troubleshooting
          exp_internal 1
          log_user 1
          set timeout 30
          set password $env(SRF_PASSWORD)
          # force TTY allocation and disable X11 forwarding
          spawn ssh -tt -o StrictHostKeyChecking=no -o ForwardX11=no $env(SRF_USER)@$env(SRF_HOST) "echo READY"
          expect {
            -re ".*assword:.*" {
              send "$password\r"
              exp_continue
            }
            -re "READY" {
              puts "OK: AUTH_SUCCESS"
              exit 0
            }
            -re ".*Permission denied.*" {
              puts "FAILURE: Permission denied (bad credentials)"
              exit 2
            }
            timeout {
              puts "FAILURE: Connection timed out"
              exit 1
            }
          }
          EOF
          chmod +x /tmp/auth_check_${{ github.run_id }}.exp
          /usr/bin/expect /tmp/auth_check_${{ github.run_id }}.exp
          RC=$?
          rm -f /tmp/auth_check_${{ github.run_id }}.exp
          if [ $RC -ne 0 ]; then
            echo "Auth check failed with code $RC"
            exit $RC
          fi

      - name: SSH into SRF host and run deploy_reboot_wrapper.py
        env:
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
          TARGET_PASSWORD: ${{ secrets.TARGET_PASSWORD }}
          BMC_PASSWORD: ${{ secrets.BMC_PASSWORD }}
          APC_PASSWORD: ${{ secrets.APC_PASSWORD }}
          SRF_HOST: ${{ inputs.srf_host }}
          SRF_USER: ${{ inputs.srf_user }}
          TARGET_IP: ${{ inputs.target_ip }}
          TARGET_USER: ${{ inputs.target_user }}
          BMC_IP: ${{ inputs.bmc_ip }}
          BMC_USER: ${{ inputs.bmc_user }}
          APC_IP: ${{ inputs.apc_ip }}
          APC_USER: ${{ inputs.apc_user }}
          APC_OUTLET: ${{ inputs.apc_outlet }}
          PUTTY_PATH: ${{ inputs.putty_path }}
        shell: bash
        run: |
          set -e

          echo "================================================="
          echo "  SRF SSH Login - Post Build Auto Login"
          echo "================================================="

          if [ -z "$SRF_PASSWORD" ]; then
            echo "FAILURE: SRF_PASSWORD is not set in environment"
            exit 1
          fi

          cat > /tmp/ssh_login_${{ github.run_id }}.exp << 'EOF'
          #!/usr/bin/expect -f
          # enable verbose debugging for the interactive login step
          exp_internal 1
          log_user 1
          set timeout 3000
          set password $env(SRF_PASSWORD)

          # start ssh session (force tty, disable X11 forwarding)
          spawn ssh -tt -o StrictHostKeyChecking=no -o ForwardX11=no $env(SRF_USER)@$env(SRF_HOST)

          # handle authentication prompt, permission denied, or timeout
          expect {
            -re ".*assword:.*" {
              send "$password\r"
              exp_continue
            }
            -re ".*Permission denied.*" {
              puts "FAILURE: Permission denied (bad credentials)"
              exit 2
            }
            -re {.*(>|#|\$|PS ).*} {
              # got shell prompt (covers cmd.exe '>' and PowerShell 'PS ')
            }
            timeout {
              puts "FAILURE: Connection timed out"
              exit 1
            }
          }

          # once at a shell prompt, set the required remote env vars silently
          # retrieve secrets from the runner environment into Tcl vars
          set target_password $env(TARGET_PASSWORD)
          set target_user $env(TARGET_USER)
          set bmc_password $env(BMC_PASSWORD)
          set apc_password $env(APC_PASSWORD)

          # suppress printing while sending secrets to avoid leaking them in logs
          log_user 0
          # use Windows 'set' to define environment variables for the current shell session
          send "set TARGET_PASSWORD=$target_password\r"
          # also set TARGET_PASS which `microcode_api` checks as an env fallback
          send "set TARGET_PASS=$target_password\r"
          send "set TARGET_USER=$target_user\r"
          send "set BMC_PASSWORD=$bmc_password\r"
          send "set APC_PASSWORD=$apc_password\r"
          # restore logging
          log_user 1

          # run commands once prompt is available (use broader prompt match)
          expect {
            -re {.*(>|#|\$|PS ).*} { send "whoami\r" }
            timeout { puts "FAILURE: Shell prompt not received"; exit 1 }
          }

          # create/update automation_config.ini on the remote host so imported
          # `apis.automation_config` will see TARGET/BMC/APC credentials at import time.
          # Backup existing file if present. Suppress logging while writing secrets.
          set tgt_ip $env(TARGET_IP)
          set tgt_user $env(TARGET_USER)
          set bmc_ip $env(BMC_IP)
          set bmc_user $env(BMC_USER)
          set apc_ip $env(APC_IP)
          set apc_user $env(APC_USER)
          set apc_outlet $env(APC_OUTLET)
          set putty_path $env(PUTTY_PATH)

          log_user 0
          send "if exist C:\\Users\\pkummara\\apis\\automation_config.ini ren C:\\Users\\pkummara\\apis\\automation_config.ini automation_config.ini.bak\r"
          send "echo [NETWORK] > C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo TARGET_IP=%tgt_ip% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo TARGET_USER=%tgt_user% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo TARGET_PASSWORD=%target_password% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo BMC_IP=%bmc_ip% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo BMC_USER=%bmc_user% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo BMC_PASSWORD=%bmc_password% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo. >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo [APC] >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo APC_IP=%apc_ip% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo APC_USER=%apc_user% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo APC_PASSWORD=%apc_password% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo APC_OUTLET=%apc_outlet% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo. >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo [PUTTY] >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          send "echo PUTTY_PATH=%putty_path% >> C:\\Users\\pkummara\\apis\\automation_config.ini\r"
          log_user 1

          expect {
            -re {.*(>|#|\$|PS ).*} { send "cd C:\\pkummara\\scripts\r" }
            timeout { puts "FAILURE: whoami did not complete"; exit 1 }
          }

          expect {
            -re {.*(>|#|\$|PS ).*} { send "C:\\Python310\\python.exe -u .\\deploy_reboot_wrapper.py\r" }
            timeout { puts "FAILURE: cd to scripts directory did not complete"; exit 1 }
          }

          expect {
            -re {.*(>|#|\$|PS ).*} { send "exit\r" }
            timeout { puts "FAILURE: Python script did not complete"; exit 1 }
          }

          expect eof
          EOF

          chmod +x /tmp/ssh_login_${{ github.run_id }}.exp
          echo "Connecting to SRF host via SSH..."
          /usr/bin/expect /tmp/ssh_login_${{ github.run_id }}.exp
          SSH_EXIT=$?
          rm -f /tmp/ssh_login_${{ github.run_id }}.exp

          if [ $SSH_EXIT -eq 0 ]; then
            echo "SUCCESS: SSH login and command executed successfully"
          else
            echo "FAILURE: SSH connection failed with exit code: $SSH_EXIT"
            exit $SSH_EXIT
          fi

      - name: Send SRF Login Notification
        if: ${{ inputs.callback_url != '' }}
        shell: bash
        run: |
          echo "Sending SRF login notification..."

          CALLBACK_URL="${{ inputs.callback_url }}"
          SESSION_ID="${{ inputs.session_id }}"

          if [ -n "$CALLBACK_URL" ]; then
              PAYLOAD=$(printf '{"session_id":"%s","status":"srf_login_completed","message":"SRF login process completed","workflow_run_id":"%s","timestamp":"%s","trigger_source":"%s","srf_login_details":{"host":"%s","user":"%s","login_timestamp":"%s"}}' \
                "$SESSION_ID" \
                "${{ github.run_id }}" \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                "${{ inputs.trigger_source }}" \
                "$SRF_HOST" \
                "$SRF_USER" \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            curl --noproxy 127.0.0.1 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "Failed to send SRF login notification"
          else
            echo "No callback URL provided, skipping notification"
          fi
