name: SRF SSH Login - Test

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SRF_HOST:
        required: true
      SRF_USERNAME:
        required: true
      SRF_PASSWORD:
        required: true

jobs:
  srf-login:
    name: SRF SSH Login
    runs-on: [self-hosted, node16]

    steps:
      - name: SSH into SRF host and run deploy_reboot_wrapper.py
        env:
          SRF_HOST: ${{ secrets.SRF_HOST }}
          SRF_USER: ${{ secrets.SRF_USERNAME }}
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
          SRF_REMOTE_WORKDIR: C:\Users\pkummara\scripts
          SRF_REMOTE_PYTHON: ${{ vars.SRF_REMOTE_PYTHON }}
          SRF_FLASH_TOOL_PATH: C:\Users\CEFLS_User\Desktop\Tools\TTK3_135\TTK3.bat
          SRF_FLASH_TOOL_ARGS: ""
        run: |
          set -euo pipefail

          [ -n "${SRF_HOST:-}" ] || { echo "SRF_HOST is empty"; exit 1; }
          [ -n "${SRF_USER:-}" ] || { echo "SRF_USERNAME is empty"; exit 1; }
          [ -n "${SRF_PASSWORD:-}" ] || { echo "SRF_PASSWORD is empty"; exit 1; }
          [ -n "${SRF_FLASH_TOOL_PATH:-}" ] || { echo "SRF_FLASH_TOOL_PATH is empty (real flash required)"; exit 1; }

          TMP_DIR="${RUNNER_TEMP:-/tmp}"
          REMOTE_WORKDIR="C:\\Users\\pkummara\\scripts"
          REMOTE_PYTHON="${SRF_REMOTE_PYTHON:-C:\\Python310\\python.exe}"
          REMOTE_FLASH_TOOL="${SRF_FLASH_TOOL_PATH}"
          REMOTE_FLASH_ARGS="${SRF_FLASH_TOOL_ARGS:-}"

          OUTPUT_LOG="${TMP_DIR}/srf_login_${GITHUB_RUN_ID}.log"
          EXP_SCRIPT="${TMP_DIR}/ssh_login_${GITHUB_RUN_ID}.exp"

          echo "================================================="
          echo "  SRF SSH Login - Post Build Auto Login"
          echo "================================================="

          cat > "$EXP_SCRIPT" << 'EOF'
          #!/usr/bin/expect -f
          set timeout 3600
          set password $env(SRF_PASSWORD)
          set srf_host $env(SRF_HOST)
          set srf_user $env(SRF_USER)
          set remote_workdir $env(REMOTE_WORKDIR)
          set remote_python $env(REMOTE_PYTHON)
          set remote_flash_tool $env(REMOTE_FLASH_TOOL)
          set remote_flash_args $env(REMOTE_FLASH_ARGS)

          proc prompt_re {} {
            return {[A-Za-z]:\\[^\r\n]*>}
          }

          spawn ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 $srf_user@$srf_host

          expect {
            -re "(?i)are you sure you want to continue connecting" {
              send "yes\r"
              exp_continue
            }
            -re "(?i)password:" {
              send "$password\r"
            }
            timeout {
              puts "FAILURE: Connection timed out"
              exit 1
            }
            eof {
              puts "FAILURE: SSH connection closed unexpectedly"
              exit 1
            }
          }

          expect {
            -re [prompt_re] { send "whoami\r" }
            timeout { puts "FAILURE: Shell prompt not received"; exit 1 }
          }

          set deploy_workdir $remote_workdir
          send "if exist \"$deploy_workdir\\deploy_reboot_wrapper.py\" (echo __WORKDIR_OK__) else (echo __WORKDIR_MISSING__)\r"
          expect {
            -re {__WORKDIR_OK__} {}
            -re {__WORKDIR_MISSING__} {
              puts "FAILURE: deploy_reboot_wrapper.py missing in requested workdir: $deploy_workdir"
              exit 1
            }
            timeout {
              puts "FAILURE: timed out while validating deploy workdir"
              exit 1
            }
          }

          set host_user_home "C:\\Users\\pkummara"
          set host_logs_dir "C:\\Users\\pkummara\\logs"
          set host_ifwi_input_dir "C:\\Users\\pkummara\\IFWI_INC_PDB\\test"

          send "cd /d $deploy_workdir\r"
          expect {
            -re [prompt_re] {}
            timeout { puts "FAILURE: unable to change to deploy workdir"; exit 1 }
          }

          send "if exist \"$remote_flash_tool\" (echo __FLASH_TOOL_OK__) else (echo __FLASH_TOOL_MISSING__:$remote_flash_tool)\r"
          set flash_tool_ok 0
          expect {
            -re {__FLASH_TOOL_OK__} {
              set flash_tool_ok 1
              exp_continue
            }
            -re {__FLASH_TOOL_MISSING__:(.+)} {
              puts "FAILURE: Flash tool not found on remote host: $expect_out(1,string)"
              exit 1
            }
            -re [prompt_re] {
              if {!$flash_tool_ok} {
                puts "FAILURE: Flash tool validation command did not return __FLASH_TOOL_OK__"
                exit 1
              }
            }
            timeout {
              puts "FAILURE: timed out while validating flash tool path"
              exit 1
            }
          }

          send "echo __REMOTE_PWD__:%CD% ^& if exist .\\deploy_reboot_wrapper.py (echo __SCRIPT_PRESENT__) else (echo __SCRIPT_MISSING__) ^& \"$remote_python\" --version\r"
          set script_present 0
          expect {
            -re {__REMOTE_PWD__:([^\r\n]+)} {
              puts "INFO: Remote working directory: $expect_out(1,string)"
              exp_continue
            }
            -re {__SCRIPT_PRESENT__} {
              set script_present 1
              exp_continue
            }
            -re {__SCRIPT_MISSING__} {
              puts "FAILURE: deploy_reboot_wrapper.py not found in current directory"
              exit 1
            }
            -re [prompt_re] {
              if {!$script_present} {
                puts "FAILURE: deploy_reboot_wrapper.py presence check did not pass"
                exit 1
              }
            }
            timeout {
              puts "FAILURE: unable to validate remote python/script state"
              exit 1
            }
          }

          send "cmd /V:ON /C \"set \"HOST_USER_HOME=$host_user_home\" ^& set \"HOST_LOGS_DIR=$host_logs_dir\" ^& set \"HOST_IFWI_INPUT_DIR=$host_ifwi_input_dir\" ^& set \"FLASH_TOOL_PATH=$remote_flash_tool\" ^& set \"FLASH_TOOL_ARGS=$remote_flash_args\" ^& set \"REQUIRE_REAL_FLASH=1\" ^& set \"SKIP_PYFIT=1\" ^& echo __PYTHON_START__ ^& \"$remote_python\" -u .\\deploy_reboot_wrapper.py ^& set \"DEPLOY_RC=!ERRORLEVEL!\" ^& echo __DEPLOY_RC__:!DEPLOY_RC! ^& exit /b !DEPLOY_RC!\"\r"

          set deploy_rc ""
          expect {
            -re {__DEPLOY_RC__:(-?[0-9]+)} {
              set deploy_rc $expect_out(1,string)
              exp_continue
            }
            -re [prompt_re] {
              if {$deploy_rc eq ""} {
                puts "FAILURE: deploy_reboot_wrapper.py did not emit a return code"
                exit 1
              }
              send "exit\r"
            }
            timeout {
              puts "FAILURE: Python script did not complete"
              exit 1
            }
            eof {
              puts "FAILURE: SSH connection closed before deploy return code"
              exit 1
            }
          }

          expect eof

          if {$deploy_rc ne "0"} {
            puts "FAILURE: deploy_reboot_wrapper.py returned code $deploy_rc"
            exit $deploy_rc
          }

          puts "SUCCESS: deploy_reboot_wrapper.py returned code 0"
          EOF

          chmod +x "$EXP_SCRIPT"
          echo "Connecting to SRF host via SSH..."
          REMOTE_WORKDIR="$REMOTE_WORKDIR" REMOTE_PYTHON="$REMOTE_PYTHON" REMOTE_FLASH_TOOL="$REMOTE_FLASH_TOOL" REMOTE_FLASH_ARGS="$REMOTE_FLASH_ARGS" /usr/bin/expect "$EXP_SCRIPT" | tee "$OUTPUT_LOG"

          if ! grep -Eiq "microcode[[:space:]]*:[[:space:]]*0x[0-9A-Fa-f]+" "$OUTPUT_LOG"; then
            echo "FAILURE: No microcode version evidence found in deploy log"
            exit 1
          fi

          if grep -Eiq "microcode[[:space:]]*:[[:space:]]*0x0\b|pyfit-stub|Flash tool not provided|No direct microcode apply command configured|stitch-only" "$OUTPUT_LOG"; then
            echo "FAILURE: Placeholder or no-apply signature detected in deploy log"
            exit 1
          fi

          if ! grep -Eiq "(MICROCODE_DEPLOY_REBOOT_STITCH_VERIFY|DEPLOY_REBOOT_VERIFY)[[:space:]]+PASSED" "$OUTPUT_LOG"; then
            echo "FAILURE: PASS marker missing in deploy log"
            exit 1
          fi

          echo "SUCCESS: SSH login, deploy flow, and real microcode evidence checks passed"
          rm -f "$EXP_SCRIPT" "$OUTPUT_LOG"
